  <style>
    /* ===================== THE APP FRAME =====================
       This page is the QR code on the back of every badge, read standing in a
       lobby: one screen that is either the schedule or the venue map, with a
       floating button flipping between the two. The document itself never
       scrolls - each pane scrolls (or sizes itself) inside a fixed frame. */
    html {
      height: 100%;
      overflow: hidden;
      /* A drag past a pane's edge must not rubber-band the whole frame */
      overscroll-behavior: none;
      /* The panes do their own scrolling; animating it is their business */
      scroll-behavior: auto;
    }

    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .app-pane {
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s 0s;
    }

    .app-pane--schedule {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      /* On a desktop browser a classic scrollbar comes and goes as slots of
         different heights are picked, and each change of width rewraps the
         time tabs. The gutter is held open so nothing ever shifts. */
      scrollbar-gutter: stable;
      /* Unfolding the past inserts a morning's worth of rows above the
         reader, and the page re-anchors the scroll itself, to the pixel.
         Chrome's own anchoring doing the same thing on top of it would
         push the view off by the whole insertion; Safari has no anchoring
         at all. Off, so the one manual adjustment is the only one. */
      overflow-anchor: none;
    }

    /* On a phone the plan sizes itself to the screen and nothing needs to
       move; anywhere else the pane scrolls like a page. */
    .app-pane--map {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .app-pane--map .floormap-areas {
      overscroll-behavior: contain;
    }

    @media (max-width: 768px) and (orientation: portrait) {
      .app-pane--map {
        overflow: hidden;
      }
    }

    /* The pane that is away waits in the wings: the schedule stage left, the
       map stage right, each fading as it goes. A switch therefore always
       reads as travel in the one direction - schedule slides off to the left
       as the map arrives from the right, and back again the same way.
       visibility waits out the slide on the way off and lifts at once on the
       way on, so the hidden pane is out of the tab order without ever
       blinking. */
    body.is-map .app-pane--schedule,
    body:not(.is-map) .app-pane--map {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s 0.38s;
    }

    body.is-map .app-pane--schedule {
      transform: translateX(-60%);
    }

    body:not(.is-map) .app-pane--map {
      transform: translateX(60%);
    }

    @media (prefers-reduced-motion: reduce) {
      .app-pane,
      body.is-map .app-pane--schedule,
      body:not(.is-map) .app-pane--map {
        transition: none;
        transform: none;
      }
    }

    /* ===================== THE SCHEDULE PANE ===================== */
    .app-shell {
      max-width: 640px;
      margin: 0 auto;
      /* Room at the foot for the last rows to scroll clear of the button,
         and at the sides for a notch in landscape */
      padding: 16px
        calc(18px + env(safe-area-inset-right, 0px))
        calc(108px + env(safe-area-inset-bottom, 0px))
        calc(18px + env(safe-area-inset-left, 0px));
    }

    /* The page name, for screen readers and the browser tab strip only -
       everyone looking at the screen is already standing at SLICE */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* The page leads with the loading pulse the other sheet-fed sections use */
    .app-shell .section-status {
      margin-top: 8px;
      text-align: center;
    }

    /* ---- the day, and the badge on the slot that is live ---- */
    .day-done {
      margin-bottom: 26px;
    }

    /* The way into the folded-away morning. In the flow above the live
       slot, so the opening scroll leaves it just off the top of the screen
       until somebody goes looking. */
    .day-past {
      text-align: center;
      margin-bottom: 22px;
    }

    .day-past__btn {
      font-size: 13px;
      padding: 11px 24px;
    }

    .live__head {
      font-family: 'Bungee', cursive;
      font-size: 23px;
      line-height: 1.25;
      color: #f5ee1d;
      text-shadow: 2px -2px 0 #BB3EFD;
    }

    /* The ticking part of the countdown. Tabular figures where the font has
       them, so the seconds do not wobble the line. */
    .live__clock {
      font-variant-numeric: tabular-nums;
    }

    /* The day is over: said in page text above the full schedule */
    .live__done {
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.7;
      color: #c0d8f0;
    }

    /* Every slot's head pins to the top of the screen while its slot scrolls
       past, so the hours a session belongs to are never out of view. The
       background is the page's own, so the rows slide beneath it cleanly. */
    #dayList .schedule-slot__head {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #00367B;
      padding-top: 10px;
    }

    /* Which slot is on right now - or how long until the next one - leading
       the pinned head in the site's heading dress, on the same baseline as
       the hours beside it and at their size. */
    .day-live-badge {
      font-family: 'Bungee', cursive;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 1px;
      color: #f5ee1d;
      text-shadow: 2px -2px 0 #BB3EFD;
    }

    @media (max-width: 640px) {
      .day-live-badge {
        font-size: 16px;
      }
    }

    /* ===================== THE MAP PANE ===================== */
    /* The venue panel is the pane's whole content here rather than a boxed
       section of a longer page, so it drops the box and takes the screen.
       The floor map script measures this panel against the window to fit the
       tabs, plan and key list on one screen - the padding below is what keeps
       the list clear of the floating button. */
    /* No min-height stretching this to the pane: the floor map script reads
       the panel's bottom edge to learn how much chrome sits below the key
       list, and a panel stretched past its content would read as chrome all
       the way down and leave the map short of the screen. */
    .venue-panel {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px
        calc(14px + env(safe-area-inset-right, 0px))
        calc(14px + env(safe-area-inset-bottom, 0px))
        calc(14px + env(safe-area-inset-left, 0px));
    }

    /* s.html only: the key hugs the left edge instead of centring, keeps out
       from under the floating schedule button in the bottom-right, and holds
       to one line at any width. Everything about the line - gaps and icons
       included - is set in em, so the fitter in the map script can shrink
       the whole of it with one font size where a phone would wrap it. At the
       stock 13px these ems come out exactly where the home page's pixel
       values do, so nothing looks different until shrinking starts. */
    .app-pane--map .venue-map__legend {
      justify-content: flex-start;
      flex-wrap: nowrap;
      gap: 1.54em;
      padding-right: calc(90px + env(safe-area-inset-right, 0px));
    }

    .app-pane--map .venue-legend {
      flex-shrink: 0;
      gap: 0.62em;
    }

    .app-pane--map .venue-legend svg {
      width: auto;
      height: 1.23em;
    }

    /* The balcony swatch is drawn shorter than the three little signs */
    .app-pane--map .venue-legend:last-child svg {
      height: 0.77em;
    }

    /* ===================== BACK TO NOW ===================== */
    /* Floats centred at the foot of the schedule, at the switch button's own
       height, whenever the live slot has been scrolled out of view */
    .app-jump {
      position: fixed;
      left: 50%;
      bottom: calc(33px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 890;
      padding: 11px 20px;
      border-radius: 999px;
      border: 2px solid #BB3EFD;
      background: #f5ee1d;
      color: #00367B;
      font-family: 'Bungee', cursive;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 5, 15, 0.5), 0 0 24px rgba(245, 238, 29, 0.22);
      transition: transform 0.2s, left 0.2s, box-shadow 0.2s;
    }

    /* Where the centred label would crowd the switch button, it hugs the
       left edge instead, with the switch's own margin. The page script
       measures and picks - see placeJump. */
    .app-jump--left {
      left: calc(18px + env(safe-area-inset-left, 0px));
      transform: none;
    }

    .app-jump[hidden] {
      display: none;
    }

    .app-jump:hover {
      box-shadow: 0 8px 26px rgba(0, 5, 15, 0.55), 0 0 34px rgba(245, 238, 29, 0.35);
    }

    .app-jump:active {
      transform: translateX(-50%) scale(0.94);
    }

    .app-jump--left:active {
      transform: scale(0.94);
    }

    .app-jump:focus-visible {
      outline: 2px solid #BB3EFD;
      outline-offset: 3px;
    }

    /* It belongs to the schedule; the map pane has its own furniture */
    body.is-map .app-jump {
      display: none;
    }

    /* Smaller type on a phone, so the label fits beside the switch button
       as often as it can */
    @media (max-width: 560px) {
      .app-jump {
        font-size: 12px;
        padding: 11px 16px;
      }
    }

    @media (max-width: 340px) {
      .app-jump {
        font-size: 11px;
      }
    }

    /* ===================== THE FLOATING SWITCH ===================== */
    /* One round button, pinned over everything: on the schedule it wears the
       map, on the map it wears the schedule - always the place it goes, not
       the place it is. The overlay scrim sits above it, so an open session
       panel covers it the way it covers the rest of the page. */
    .app-fab {
      position: fixed;
      right: calc(18px + env(safe-area-inset-right, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 900;
      width: 72px;
      height: 72px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #BB3EFD;
      background: #f5ee1d;
      color: #00367B;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 5, 15, 0.5), 0 0 24px rgba(245, 238, 29, 0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .app-fab:hover {
      box-shadow: 0 8px 26px rgba(0, 5, 15, 0.55), 0 0 34px rgba(245, 238, 29, 0.35);
    }

    .app-fab:active {
      transform: scale(0.92);
    }

    .app-fab:focus-visible {
      outline: 2px solid #BB3EFD;
      outline-offset: 3px;
    }

    /* The two faces of the button, crossfading with a little turn as the
       panes trade places under it */
    .app-fab__icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-fab__icon svg {
      display: block;
      width: 36px;
      height: 36px;
    }

    .app-fab__icon--sched {
      opacity: 0;
      transform: rotate(-90deg) scale(0.6);
    }

    .app-fab.is-map .app-fab__icon--sched {
      opacity: 1;
      transform: none;
    }

    .app-fab.is-map .app-fab__icon--map {
      opacity: 0;
      transform: rotate(90deg) scale(0.6);
    }

    @media (prefers-reduced-motion: reduce) {
      .app-fab__icon {
        transition: opacity 0.25s ease;
        transform: none;
      }

      .app-fab__icon--sched,
      .app-fab.is-map .app-fab__icon--map {
        transform: none;
      }
    }

    /* The panel is focused as a whole when it opens (see the OVERLAY FOCUS
       script), and a container is not a control - no ring on it */
    .speaker-overlay__panel:focus {
      outline: none;
    }

    /* ===================== VENUE MAP LEGEND (from index.html) ===================== */
    .venue-map__legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 20px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.4;
      color: #a0c4e8;
    }

    .venue-legend {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .venue-legend svg {
      flex-shrink: 0;
    }

    /* ===================== SLICE FLOOR MAP (from index.html) ===================== */
    /* ===================== SLICE FLOOR MAP ===================== */
    /* The four levels always read as one row, at every width */
    .floormap-tabs {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .floormap-tab {
      font-family: 'Bungee', cursive;
      font-size: 14px;
      padding: 9px 22px;
      color: #a0c4e8;
      background: transparent;
      border: 2px solid #1a4a8a;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .floormap-tab:hover {
      border-color: #BB3EFD;
      color: #f5ee1d;
    }

    .floormap-tab.is-active {
      background: #f5ee1d;
      border-color: #f5ee1d;
      color: #00367B;
    }

    /* Same brand focus ring the session tabs use */
    .floormap-tab:focus-visible,
    .floormap-area:focus-visible {
      outline: 2px solid #BB3EFD;
      outline-offset: 2px;
    }

    .floormap-floor[hidden] {
      display: none;
    }

    /* Same sideways-scroll treatment as the parking map: on a phone the plan
       keeps a readable size and pans instead of shrinking. */
    .floormap__scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
    }

    .floormap__inner {
      position: relative;
      min-width: 640px;
    }

    .floormap__svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* Numbered spots on the map */
    .floormap-spot {
      cursor: pointer;
      outline: none;
    }

    .floormap-spot circle {
      fill: #f5ee1d;
      stroke: #BB3EFD;
      stroke-width: 2.5;
      transition: stroke 0.15s;
    }

    .floormap-spot text {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #00367B;
      pointer-events: none;
    }

    .floormap-spot:hover circle,
    .floormap-spot:focus-visible circle,
    .floormap-spot.is-hot circle {
      stroke: #ffffff;
      filter: drop-shadow(0 0 7px rgba(245, 238, 29, 0.9));
    }

    /* Interactive staircases: hover lights the well, click rides it */
    .floormap-stair {
      cursor: pointer;
      outline: none;
    }

    .floormap-stair:hover rect,
    .floormap-stair:focus-visible rect {
      stroke: #f5ee1d;
      filter: drop-shadow(0 0 6px rgba(245, 238, 29, 0.55));
    }

    /* The footprint an area covers: invisible until its spot or card is
       hovered, then a clear brand-yellow wash. */
    .floormap-region {
      fill: #f5ee1d;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .floormap-region.is-hot {
      opacity: 0.34;
    }

    /* The info popup, styled after the speaker overlay panel */
    .floormap-pop {
      position: absolute;
      z-index: 5;
      max-width: 240px;
      padding: 10px 14px 11px;
      background: #001a3d;
      border: 2px solid #f5ee1d;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 5, 15, 0.55);
      transform: translate(-50%, -100%);
      pointer-events: none;
      text-align: center;
    }

    /* Once pinned, the popup takes the tap itself and dismisses, rather than
       letting the tap fall through onto whatever spot sits underneath. Hover
       popups stay transparent to the pointer so they cannot flicker. */
    .floormap-pop.is-pinned {
      pointer-events: auto;
      cursor: pointer;
    }

    .floormap-pop[hidden] {
      display: none;
    }

    .floormap-pop::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 12px;
      height: 12px;
      background: #001a3d;
      border-right: 2px solid #f5ee1d;
      border-bottom: 2px solid #f5ee1d;
      transform: translateX(-50%) rotate(45deg);
    }

    /* Flipped variant when the marker sits near the top of the plan */
    .floormap-pop.is-below {
      transform: translate(-50%, 0);
    }

    .floormap-pop.is-below::after {
      bottom: auto;
      top: -7px;
      border: none;
      border-left: 2px solid #f5ee1d;
      border-top: 2px solid #f5ee1d;
    }

    /* A popup lifted off the marker to sit over its sibling (the dual 1E
       indicators when the marker rides the pane's bottom edge) drops its
       arrow, which would otherwise point at the sibling rather than the
       marker. */
    .floormap-pop.is-stacked::after {
      display: none;
    }

    .floormap-pop__name {
      font-family: 'Bungee', cursive;
      font-size: 13px;
      color: #f5ee1d;
      margin-bottom: 4px;
    }

    /* Second line for a marker that covers two areas, split by a brand rule */
    .floormap-pop__name2 {
      font-family: 'Bungee', cursive;
      font-size: 13px;
      color: #f5ee1d;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 2px solid #f5ee1d;
    }

    .floormap-pop__name2[hidden] {
      display: none;
    }

    /* The areas of interest, listed under the map */
    .floormap-areas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 16px;
      /* Brand-coloured scrollbar for when the list scrolls (portrait) */
      scrollbar-width: thin;
      scrollbar-color: #f5ee1d rgba(0, 20, 50, 0.55);
    }

    .floormap-areas::-webkit-scrollbar {
      width: 8px;
    }

    .floormap-areas::-webkit-scrollbar-track {
      background: rgba(0, 20, 50, 0.55);
      border-radius: 4px;
    }

    .floormap-areas::-webkit-scrollbar-thumb {
      background: #f5ee1d;
      border-radius: 4px;
      border: 1px solid #BB3EFD;
    }

    .floormap-areas::-webkit-scrollbar-thumb:hover,
    .floormap-areas::-webkit-scrollbar-thumb:active {
      background: #BB3EFD;
      border-color: #f5ee1d;
    }

    .floormap-area {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(0, 20, 50, 0.45);
      border: none;
      border-left: 3px solid #BB3EFD;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .floormap-area:hover,
    .floormap-area.is-hot {
      background: rgba(187, 62, 253, 0.18);
      border-left-color: #f5ee1d;
    }

    .floormap-area__num {
      flex-shrink: 0;
      min-width: 36px;
      height: 26px;
      padding: 0 6px;
      border-radius: 13px;
      background: #f5ee1d;
      border: 2px solid #BB3EFD;
      color: #00367B;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floormap-area__name {
      display: block;
      font-family: 'Bungee', cursive;
      font-size: 13px;
      color: #f5ee1d;
      margin-bottom: 3px;
    }

    .floormap-area__desc {
      display: block;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #a0c4e8;
    }

    @media (max-width: 768px) {
      .floormap-tabs {
        gap: 6px;
      }
      .floormap-tab {
        flex: 1 1 0;
        min-width: 0;
        font-size: clamp(9px, 2.7vw, 12px);
        padding: 8px 4px;
        white-space: nowrap;
        text-align: center;
      }
      .floormap-areas {
        grid-template-columns: 1fr;
      }
      /* The floor plans scale down harder than the parking map, so their
         minor labels come off earlier than the shared 620px cutoff. */
      .floormap__svg .venue-map__label--minor {
        display: none;
      }
    }

    /* Mobile portrait: stand the map on its side so a whole floor fits with
       no sideways scrolling (north ends up at the top), and give the key list
       its own scroll pane. JS sizes both so the tabs, map and list share one
       screen; the vh fallbacks keep it sane before that runs. */
    @media (max-width: 768px) and (orientation: portrait) {
      .floormap__scroll {
        overflow: visible;
      }

      .floormap__inner {
        position: relative;
        min-width: 0;
        width: 100%;
        height: var(--fm-map-h, 46vh);
      }

      .floormap__svg {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--fm-svg-w, 46vh);
        height: var(--fm-svg-h, 17.4vh);
        transform: translate(-50%, -50%) rotate(90deg);
      }

      /* The labels counter-rotating upright, and the markers scaling up to
         stay readable, are applied as SVG transform attributes from script
         rather than CSS here - see applyPortraitTransforms() for why. */

      .floormap-areas {
        max-height: var(--fm-list-h, 26vh);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-right: 4px;
      }
    }
  </style>

  <div class="app-pane app-pane--schedule" id="schedulePane">
    <div class="app-shell">

           masthead - the heading is for screen readers and the tab strip. -->
      <h1 class="visually-hidden">SLICE 2026 Schedule &amp; Map</h1>

      <div class="day-done" id="dayDone" hidden>

        </p>

           scrolled to the live slot, so this sits just above the fold -
           scrolling up (presumably looking for what was missed) finds it.
           Once pressed there is no way back short of a refresh. -->
      <p class="day-past" id="dayPast" hidden>
        <button class="btn btn--outline day-past__btn" id="dayPastBtn" type="button">
          Show Past Sessions

           while its sessions scroll past, the slot that is on right now
           wears a Happening Now badge in its head - or a ticking countdown
           while the next one is still coming - and the page opens scrolled
           straight to it. Slots already over when the page opened hide
           behind the button above. All of it is filled in and kept current
           by the page script below. -->
      <div class="schedule schedule--tabbed" id="dayList"></div>

       shared.js reads it as it starts; schedule.js is here for the slot

  <script src="js/tabs.js?v=2026-08-21"></script>
  <script src="js/schedule.js?v=2026-08-25"></script>

  <script>
    // ===================== SLICE FLOOR MAP =====================
    // The interactive venue map inside the SLICE Map panel: floor tabs, and
    // lettered spots (1A, 2B, ...) that light up and explain themselves. The
    // single card list below covers every floor; picking a card for another
    // level switches the map to that level first.
    (function() {
      const panel = document.getElementById('sliceMapPanel');
      if (!panel) return;

      const tabs = Array.from(panel.querySelectorAll('.floormap-tab'));
      const floors = Array.from(panel.querySelectorAll('.floormap-floor'));

      function centreFloor(floor) {
        const scroller = floor.querySelector('.floormap__scroll');
        if (!scroller) return;
        window.requestAnimationFrame(function() {
          scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
        });
      }

      // ---- tabs ----
      function activateTab(tab) {
        // Re-activating the current floor should not reset the pan or
        // dismiss a pinned popup
        if (tab.classList.contains('is-active')) return;
        tabs.forEach(function(t) {
          const on = t === tab;
          t.classList.toggle('is-active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          // Roving tabindex: only the selected tab sits in the tab order
          t.setAttribute('tabindex', on ? '0' : '-1');
        });
        floors.forEach(function(fl) {
          const show = fl.id === tab.getAttribute('aria-controls');
          fl.hidden = !show;
          if (show) centreFloor(fl);
        });
        // The floor that just came up can be measured for the first time, so
        // its labels can finally turn about their real centres
        if (portraitQuery && portraitQuery.matches) applyPortraitTransforms(true);
        hidePop();
      }

      tabs.forEach(function(tab, i) {
        tab.addEventListener('click', function() { activateTab(tab); frameMap(); });
        // Arrow keys walk the floor list, as tab widgets are expected to.
        // stopPropagation keeps the press from reaching anything else
        // listening for arrows at the document level.
        tab.addEventListener('keydown', function(e) {
          let next = null;
          if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
          if (e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
          if (e.key === 'Home') next = tabs[0];
          if (e.key === 'End') next = tabs[tabs.length - 1];
          if (next) {
            e.preventDefault();
            e.stopPropagation();
            if (next !== tab) {
              next.focus();
              next.click();
            }
          }
        });
      });

      // ---- mobile portrait: fit tabs, map and key list on one screen ----
      const tabsEl = panel.querySelector('.floormap-tabs');
      const legendEl = panel.querySelector('.venue-map__legend');
      const portraitQuery = window.matchMedia
        ? window.matchMedia('(max-width: 768px) and (orientation: portrait)')
        : null;
      const FM_VARS = ['--fm-map-h', '--fm-svg-w', '--fm-svg-h', '--fm-list-h'];

      // Turned on its side the plan carries dead space at the ends, so
      // portrait runs a tighter window: 10% off the top, 3% off the bottom.
      // (Screen top is the plan's west end, hence the crop is along x.)
      const BASE_VB = (function() {
        const svg = panel.querySelector('.floormap__svg');
        return svg ? svg.getAttribute('viewBox') : '24 38 1120 424';
      })();
      const PORTRAIT_VB = (function() {
        const p = BASE_VB.split(/[\s,]+/).map(Number);
        const top = p[2] * 0.10, bottom = p[2] * 0.03;
        return [p[0] + top, p[1], p[2] - top - bottom, p[3]].join(' ');
      })();

      function applyViewBox(vb) {
        panel.querySelectorAll('.floormap__svg').forEach(function(svg) {
          if (svg.getAttribute('viewBox') !== vb) svg.setAttribute('viewBox', vb);
        });
      }

      // Portrait turns each label upright and grows the markers. Both want to
      // happen about the element's own centre, and CSS does that with
      // transform-box: fill-box - which WebKit ignores on SVG groups, so on
      // iPhone every marker scaled about the middle of the whole plan and
      // landed somewhere else entirely. SVG transform attributes carry their
      // own explicit origin, so they behave the same in every browser, and
      // getBoundingClientRect then agrees with what is actually drawn, which
      // is what keeps the popups pinned to their markers.
      // A label has to turn about the point it is meant to stay on. The CSS
      // this replaced used transform-box: fill-box, which turns about the
      // centre of the label's own inked box, and the x and y attributes are not
      // that point: y is the text baseline, which on a marker sits below the
      // middle of the circle, so turning about it swings the code out of its
      // circle. A marker turns about its circle instead, which is known exactly
      // and needs no measuring. Anything else turns about the box getBBox
      // reports, which is the same box fill-box used and reads the same in
      // every browser - but it only answers for a floor that is on screen, so
      // the last good reading is kept for the floors that are not.
      function labelOrigin(label) {
        const spot = label.closest('.floormap-spot');
        if (spot) {
          return [parseFloat(spot.getAttribute('data-x')) || 0,
                  parseFloat(spot.getAttribute('data-y')) || 0];
        }
        let box = null;
        try { box = label.getBBox(); } catch (e) { box = null; }
        if (box && (box.width || box.height)) {
          const ox = box.x + box.width / 2;
          const oy = box.y + box.height / 2;
          label.setAttribute('data-ox', ox);
          label.setAttribute('data-oy', oy);
          return [ox, oy];
        }
        const seen = label.getAttribute('data-ox');
        if (seen !== null) return [parseFloat(seen), parseFloat(label.getAttribute('data-oy'))];
        // Never measurable so far: the anchor keeps it upright, near enough,
        // until its floor comes up and the real centre can be read
        return [parseFloat(label.getAttribute('x')) || 0,
                parseFloat(label.getAttribute('y')) || 0];
      }

      function applyPortraitTransforms(on) {
        panel.querySelectorAll('.floormap__svg text').forEach(function(label) {
          if (!on) { label.removeAttribute('transform'); return; }
          const o = labelOrigin(label);
          // The Level 2 auditorium label also slides clear of the 2A marker
          const nudge = label.classList.contains('fm-aud') &&
                        label.closest('#fmFloor2') ? 'translate(-92 0) ' : '';
          // The stair destination tags grow like the markers do, or at this
          // scale they would be too small to read. Same fixed point as the
          // rotation, so they stay put beside their staircase.
          const grow = label.classList.contains('fm-stairlbl')
            ? ' translate(' + o[0] + ' ' + o[1] + ') scale(1.45) translate(' + (-o[0]) + ' ' + (-o[1]) + ')'
            : '';
          label.setAttribute('transform', nudge + 'rotate(-90 ' + o[0] + ' ' + o[1] + ')' + grow);
        });
        panel.querySelectorAll('.floormap-spot').forEach(function(spot) {
          if (!on) { spot.removeAttribute('transform'); return; }
          const x = parseFloat(spot.getAttribute('data-x')) || 0;
          const y = parseFloat(spot.getAttribute('data-y')) || 0;
          spot.setAttribute('transform',
            'translate(' + x + ' ' + y + ') scale(1.45) translate(' + (-x) + ' ' + (-y) + ')');
        });
        // The elevator arrows and restroom figures counter-rotate about their
        // own box centres, which each fm-glyph group carries as data: up and
        // down keep meaning up and down whichever way the plan is turned.
        panel.querySelectorAll('.fm-glyph').forEach(function(g) {
          if (!on) { g.removeAttribute('transform'); return; }
          const x = parseFloat(g.getAttribute('data-cx')) || 0;
          const y = parseFloat(g.getAttribute('data-cy')) || 0;
          g.setAttribute('transform', 'rotate(-90 ' + x + ' ' + y + ')');
        });
      }

      // Width the current portrait sizing was built for; null means unsized
      let sizedForWidth = null;

      // The key holds to one line at any width: everything in it is sized in
      // em, so where the line would wrap it is refit by lowering the one
      // font size until the items sit inside the room the padding leaves -
      // which includes the corner reserved for the floating button.
      function fitLegend() {
        if (!legendEl) return;
        legendEl.style.fontSize = '';
        const style = window.getComputedStyle(legendEl);
        const room = legendEl.clientWidth -
          (parseFloat(style.paddingLeft) || 0) -
          (parseFloat(style.paddingRight) || 0);
        if (room <= 0) return;

        const items = Array.from(legendEl.children);
        let wants = (parseFloat(style.columnGap) || 0) * (items.length - 1);
        items.forEach(function(item) {
          wants += item.getBoundingClientRect().width;
        });
        if (wants <= room) return;

        const base = parseFloat(style.fontSize) || 13;
        legendEl.style.fontSize =
          Math.max(8, Math.floor(base * (room / wants) * 10) / 10) + 'px';
      }

      function layoutPortrait(force) {
        fitLegend();
        if (!portraitQuery || !portraitQuery.matches) {
          FM_VARS.forEach(function(v) { panel.style.removeProperty(v); });
          applyViewBox(BASE_VB);
          applyPortraitTransforms(false);
          sizedForWidth = null;
          return;
        }
        applyViewBox(PORTRAIT_VB);
        applyPortraitTransforms(true);
        // Only measure while the panel is actually on screen, or the reading
        // is meaningless and the map ends up sized off a collapsed layout.
        if (panel.hidden) return;
        // Phones fire resize constantly as the address bar slides in and out
        // while scrolling, which would resize the map under the reader. Size
        // once per width and hold it; a rotation passes force to redo it.
        if (!force && sizedForWidth === window.innerWidth) return;
        // The floor on screen, not the first in the document: a hidden floor
        // is display:none and measures as nothing, and by the time the map is
        // asked to show a room the active floor may not be Level 1
        const anyInner =
          panel.querySelector('.floormap-floor:not([hidden]) .floormap__inner') ||
          panel.querySelector('.floormap__inner');
        const areasEl = panel.querySelector('.floormap-areas');
        if (!anyInner || !areasEl) return;
        const vb = viewBoxOf(anyInner);
        const ratio = vb[3] / vb[2];  // short side over long side of the plan
        // Measure what sits above the map and below the list rather than
        // guessing, so wrapping tabs or legend never throw the fit off
        const panelBox = panel.getBoundingClientRect();
        const mapBox = anyInner.getBoundingClientRect();
        const listBox = areasEl.getBoundingClientRect();
        const above = mapBox.top - panelBox.top;
        const below = panelBox.bottom - listBox.bottom;
        const usable = Math.max(320, window.innerHeight - above - below - 24);
        // The map is the centrepiece, so it takes the bulk of the height; the
        // list keeps a couple of rows visible and scrolls for the rest.
        const mapH = Math.round(Math.max(240, Math.min(usable * 0.74, usable - 148)));
        const listH = Math.max(120, Math.round(usable - mapH));
        // Turned 90deg, the svg's own width becomes the map's height
        panel.style.setProperty('--fm-map-h', mapH + 'px');
        panel.style.setProperty('--fm-svg-w', mapH + 'px');
        panel.style.setProperty('--fm-svg-h', Math.round(mapH * ratio) + 'px');
        panel.style.setProperty('--fm-list-h', listH + 'px');
        sizedForWidth = window.innerWidth;
      }

      layoutPortrait();
      window.addEventListener('orientationchange', function() {
        window.setTimeout(function() { layoutPortrait(true); }, 120);
      });
      // Fonts and images settle after parse, which moves the measurements
      window.addEventListener('load', function() { layoutPortrait(true); });
      // A window resized across the portrait line has to be laid out afresh
      // even though nothing rotated
      if (portraitQuery && portraitQuery.addEventListener) {
        portraitQuery.addEventListener('change', function() { layoutPortrait(true); });
      }

      // ---- the map as a pane ----
      // The home page parks the page on the panel when the map is touched,
      // and lets scrolling away end the mode. Here the map is a whole pane
      // of its own with nothing behind it to scroll, so there is nothing to
      // frame - the calls the shared handlers still make land on this stub.
      function frameMap() {}

      // Centre whichever floor is showing as the page opens
      const shown = floors.filter(function(fl) { return !fl.hidden; })[0];
      if (shown) centreFloor(shown);

      // ---- spots, cards and the popup ----
      function viewBoxOf(inner) {
        const svg = inner.querySelector('.floormap__svg');
        const vb = (svg && svg.getAttribute('viewBox') || '0 0 1120 520').split(/[\s,]+/).map(Number);
        return vb.length === 4 ? vb : [0, 0, 1120, 520];
      }

      let pinned = null;    // the spot whose popup is click-pinned open
      let shownSpot = null; // the spot whose popup is on screen, pinned or not
      let popFloor = null;

      function fillPop(pop, name, extras) {
        pop.querySelector('.floormap-pop__name').textContent = name || '';
        pop.querySelectorAll('.floormap-pop__name2').forEach(function(el, i) {
          el.textContent = extras[i] || '';
          el.hidden = !extras[i];
        });
      }

      function showPop(spot) {
        shownSpot = spot;
        const inner = spot.closest('.floormap__inner');
        const pop = inner.querySelector('.floormap-pop:not(.floormap-pop--b)');
        const popB = inner.querySelector('.floormap-pop--b');
        pop.classList.toggle('is-pinned', pinned === spot);
        // A spot with data-pop2 answers with two indicators at once on
        // desktop, where there is room around the marker to read them. On a
        // phone the pair crowds the little pane, so the second indicator's
        // names fold back into the main popup as more stacked lines instead.
        const dual = !!(popB && spot.getAttribute('data-pop2')) &&
          !(window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
        // Tooltips stay terse - just the names, stacked, for the spots that
        // cover more than one thing (the cards below carry the detail).
        fillPop(pop, spot.getAttribute('data-name'), dual
          ? [spot.getAttribute('data-name2'), spot.getAttribute('data-name3')]
          : [spot.getAttribute('data-name2') || spot.getAttribute('data-pop2'),
             spot.getAttribute('data-name3') || spot.getAttribute('data-pop2b')]);

        // Measure the marker where it actually lands on screen, so the popup
        // follows the map through any transform - the portrait layout turns
        // the whole plan 90 degrees.
        const w = inner.clientWidth;
        const h = inner.clientHeight;
        const mb = spot.getBoundingClientRect();
        const ib = inner.getBoundingClientRect();
        const x = mb.left + mb.width / 2 - ib.left;
        const y = mb.top + mb.height / 2 - ib.top;

        // Measure invisibly, then clamp inside the plan. An absolutely
        // positioned box can only grow rightward to its containing block's
        // edge - the centring translate comes after the width is resolved -
        // so a popup placed past the pane's middle gets squeezed into wraps.
        // Measuring at the left edge finds the natural size, and freezing it
        // as an explicit width keeps the real position from re-wrapping it.
        pop.style.visibility = 'hidden';
        pop.style.left = '0px';
        pop.style.width = 'auto';
        pop.hidden = false;
        // Ceiling plus one: the natural width lands on a fraction, and
        // freezing it rounded down leaves the longest line a hair short,
        // which wraps it
        const pw = Math.ceil(pop.getBoundingClientRect().width) + 1;
        pop.style.width = pw + 'px';
        const ph = pop.offsetHeight;
        const left = Math.min(Math.max(x, pw / 2 + 6), w - pw / 2 - 6);
        const below = !dual && y - ph - 26 < 4;
        pop.classList.remove('is-stacked');
        pop.classList.toggle('is-below', below);
        pop.style.left = left.toFixed(1) + 'px';
        pop.style.top = (below ? y + 24 : y - 24).toFixed(1) + 'px';
        pop.style.visibility = '';

        if (popB) {
          if (!dual) {
            popB.hidden = true;
            popB.classList.remove('is-pinned');
          } else {
            popB.classList.toggle('is-pinned', pinned === spot);
            fillPop(popB, spot.getAttribute('data-pop2'), [spot.getAttribute('data-pop2b')]);
            popB.style.visibility = 'hidden';
            popB.style.left = '0px';
            popB.style.width = 'auto';
            popB.hidden = false;
            const bw = Math.ceil(popB.getBoundingClientRect().width) + 1;
            popB.style.width = bw + 'px';
            const bh = popB.offsetHeight;
            const bleft = Math.min(Math.max(x, bw / 2 + 6), w - bw / 2 - 6);
            popB.style.left = bleft.toFixed(1) + 'px';
            if (y + 24 + bh <= h - 4) {
              popB.classList.add('is-below');
              popB.style.top = (y + 24).toFixed(1) + 'px';
            } else {
              // No room under the marker (portrait turns this corner of the
              // plan to the pane's bottom edge), so both ride above it in the
              // same order: the second against the marker, the main one over
              // it, arrowless so it does not point at its sibling.
              popB.classList.remove('is-below');
              popB.style.top = (y - 24).toFixed(1) + 'px';
              pop.classList.add('is-stacked');
              pop.style.top = (y - 24 - bh - 6).toFixed(1) + 'px';
            }
            popB.style.visibility = '';
          }
        }
        popFloor = inner;
      }

      function hidePop() {
        pinned = null;
        shownSpot = null;
        if (popFloor) {
          popFloor.querySelectorAll('.floormap-pop').forEach(function(pop) {
            pop.hidden = true;
            pop.classList.remove('is-pinned');
            pop.classList.remove('is-stacked');
          });
          popFloor = null;
        }
        // Touch taps leave is-hot behind with no mouseleave to clear it;
        // keep it only where a real pointer is still hovering.
        panel.querySelectorAll('.is-hot').forEach(function(el) {
          if (!el.matches || !el.matches(':hover')) el.classList.remove('is-hot');
        });
      }

      // Re-fit the portrait layout, and keep a visible popup anchored, on resize
      let resizeQueued = false;
      window.addEventListener('resize', function() {
        if (resizeQueued) return;
        resizeQueued = true;
        window.requestAnimationFrame(function() {
          resizeQueued = false;
          layoutPortrait();
          if (shownSpot) showPop(shownSpot);
        });
      });

      // Tapping the popup itself dismisses it, instead of the tap falling
      // through to whatever spot happens to sit underneath
      panel.querySelectorAll('.floormap-pop').forEach(function(pop) {
        pop.addEventListener('click', function(e) {
          e.stopPropagation();
          frameMap();
          hidePop();
        });
      });

      // A spot can answer to several cards (one marker covering two areas),
      // and a group of spots can share a single card (the roundtables).
      function cardsFor(spot) {
        const group = spot.getAttribute('data-group');
        const sel = group
          ? '.floormap-area[data-group="' + group + '"]'
          : '.floormap-area[data-for="' + spot.getAttribute('data-spot') + '"]';
        return Array.from(panel.querySelectorAll(sel));
      }

      function spotsFor(card) {
        const group = card.getAttribute('data-group');
        if (group) return Array.from(panel.querySelectorAll('.floormap-spot[data-group="' + group + '"]'));
        const one = panel.querySelector('.floormap-spot[data-spot="' + card.getAttribute('data-for') + '"]');
        return one ? [one] : [];
      }

      function regionFor(spot) {
        return panel.querySelector('.floormap-region[data-for="' + spot.getAttribute('data-spot') + '"]');
      }

      // Tapping a spot on the phone should bring its card into the list's
      // window, so the detail is readable without a second scroll. Sits it at
      // the top where possible, clamped so the last card cannot overshoot.
      function revealCard(spot) {
        if (!portraitQuery || !portraitQuery.matches) return;
        const areas = panel.querySelector('.floormap-areas');
        const card = cardsFor(spot)[0];
        if (!areas || !card) return;
        const max = areas.scrollHeight - areas.clientHeight;
        if (max <= 0) return;
        const target = areas.scrollTop +
          (card.getBoundingClientRect().top - areas.getBoundingClientRect().top);
        const reduce = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        areas.scrollTo({
          top: Math.max(0, Math.min(target, max)),
          behavior: reduce ? 'auto' : 'smooth'
        });
      }

      function setHot(spot, on) {
        spot.classList.toggle('is-hot', on);
        cardsFor(spot).forEach(function(card) { card.classList.toggle('is-hot', on); });
        const region = regionFor(spot);
        if (region) region.classList.toggle('is-hot', on);
      }

      panel.querySelectorAll('.floormap-spot').forEach(function(spot) {
        function togglePin() {
          if (pinned === spot) {
            hidePop();
          } else {
            pinned = spot;
            showPop(spot);
            revealCard(spot);
          }
        }
        spot.addEventListener('mouseenter', function() {
          setHot(spot, true);
          if (!pinned) showPop(spot);
        });
        spot.addEventListener('mouseleave', function() {
          setHot(spot, false);
          if (!pinned) hidePop();
        });
        spot.addEventListener('focus', function() {
          if (!pinned) showPop(spot);
        });
        spot.addEventListener('blur', function() {
          if (!pinned) hidePop();
        });
        spot.addEventListener('click', function(e) {
          e.stopPropagation();
          frameMap();
          togglePin();
        });
        // SVG elements have no click() method, so run the handler directly
        spot.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            frameMap();
            togglePin();
          }
        });
      });

      // Bringing a marker up, wherever the asking came from. A card under the
      // map can belong to a floor that is not on screen, so the floor is
      // switched first, then the plan is panned across to the marker and its
      // popup is pinned open. The map button on a session panel asks for
      // exactly this, from the other end of the page.
      function goToSpot(spot) {
        const floorBlock = spot.closest('.floormap-floor');
        if (floorBlock && floorBlock.hidden) {
          const tab = tabs.filter(function(t) {
            return t.getAttribute('aria-controls') === floorBlock.id;
          })[0];
          if (tab) activateTab(tab);
        }
        const scroller = spot.closest('.floormap__scroll');
        const inner = spot.closest('.floormap__inner');
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // After a floor switch, centreFloor has queued its own scroll for
        // the next frame; queue ours after it so the marker wins.
        window.requestAnimationFrame(function() {
          window.requestAnimationFrame(function() {
            const vb = viewBoxOf(inner);
            const x = ((parseFloat(spot.getAttribute('data-x')) - vb[0]) / vb[2]) * inner.clientWidth;
            scroller.scrollTo({ left: x - scroller.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' });
          });
        });
        pinned = spot;
        showPop(spot);
      }

      panel.querySelectorAll('.floormap-area').forEach(function(card) {
        const group = spotsFor(card);
        const spot = group[0];
        if (!spot) return;
        card.addEventListener('mouseenter', function() {
          group.forEach(function(s) { setHot(s, true); });
        });
        card.addEventListener('mouseleave', function() {
          group.forEach(function(s) { setHot(s, false); });
        });
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          frameMap();
          goToSpot(spot);
        });
      });

      // ---- staircases: tooltips, and clicks that ride to the other level ----
      panel.querySelectorAll('.floormap-stair').forEach(function(stair) {
        const proxy = stair.getAttribute('data-proxy');
        const proxySpot = proxy ? panel.querySelector('.floormap-spot[data-spot="' + proxy + '"]') : null;

        stair.addEventListener('mouseenter', function() {
          if (proxySpot) setHot(proxySpot, true);
          if (!pinned) showPop(proxySpot || stair);
        });
        stair.addEventListener('mouseleave', function() {
          if (proxySpot) setHot(proxySpot, false);
          if (!pinned) hidePop();
        });
        stair.addEventListener('focus', function() {
          if (!pinned) showPop(proxySpot || stair);
        });
        stair.addEventListener('blur', function() {
          if (!pinned) hidePop();
        });

        function act(e) {
          e.stopPropagation();
          frameMap();
          if (proxySpot) {
            // The Lecture Hall stair is an extension of the 1C icon
            proxySpot.dispatchEvent(new MouseEvent('click', { bubbles: false }));
            return;
          }
          const tab = document.getElementById('fmTab' + stair.getAttribute('data-target'));
          if (tab) tab.click();
        }
        stair.addEventListener('click', act);
        stair.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            act(e);
          }
        });
      });

      // A tap anywhere else lets go of a pinned popup. Tabs are excluded:
      // switching floors already dismisses via activateTab, and re-tapping
      // the current floor's tab should not throw the popup away.
      document.addEventListener('click', function(e) {
        if (pinned && !e.target.closest('.floormap-spot') &&
            !e.target.closest('.floormap-area') && !e.target.closest('.floormap-tab')) hidePop();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') hidePop();
      });

      // ---- reaching the map from elsewhere on the page ----
      // A session panel's map button hands over the room the sheet wrote and
      // expects the reader to end up looking at it. Which marker that is is the
      // map's own business, so the lookup lives here beside the markers rather
      // than with the schedule that names the rooms.
      //
      // The keys are what the sheet's Room column holds - see SCHEDULE_ROOMS in
      // js/schedule.js - along with the rooms the schedule's fixtures carry.
      const ROOM_SPOTS = {
        A: 'l2-A',    // the Auditorium is entered off the Level 2 lobby
        LH: 'l1-C',   // the Lecture Hall is down the stairs beside 1C
        AR: 'l4-A',   // Allen Room
        NR: 'l4-B',   // Norcliffe Room
        L1: 'l1-D',   // the playtest floor, along the Level 1 lobby
        L2: 'l2-C'    // coffee in the Level 2 lobby
      };

      function spotForRoom(room) {
        const key = String(room || '').trim().toUpperCase();
        if (!key) return null;

        let id = ROOM_SPOTS[key] || '';
        // 1A to 1D are the breakfast tables and 1A is where the speed
        // networking runs: all of them are the Cafe, which is the one marker
        if (!id && /^1[A-D]$/.test(key)) id = 'l1-E';
        // Anything else written the way the markers are - 5D, 1F, 2B - is taken
        // as it comes, so a room the sheet picks up later finds its own spot
        // without a line here. An id no marker answers to falls through to null
        // and the button that asked simply does not appear.
        if (!id) {
          const parts = key.match(/^(\d)([A-Z])$/);
          if (parts) id = 'l' + parts[1] + '-' + parts[2];
        }

        return id ? panel.querySelector('.floormap-spot[data-spot="' + id + '"]') : null;
      }

      // A marker standing for more than one thing is named for the place
      // rather than for whichever of them its own label leads with: 1E carries
      // the breakfast, the pitch competition and the speed networking, and a
      // session at any of them is being sent to the Cafe.
      const SPOT_PLACES = { 'l1-E': 'the Caf\u00e9' };

      // What the map calls the place a room lands on, or '' where the map has
      // no marker for it. A panel elsewhere asks this for both things it needs:
      // whether it has anywhere to send anybody, and what to call it. Named off
      // the marker rather than off the schedule's own word for the room, so the
      // button says what the reader will be looking at when they get there.
      window.sliceMapPlaceFor = function(room) {
        const spot = spotForRoom(room);
        if (!spot) return '';
        return SPOT_PLACES[spot.getAttribute('data-spot')] ||
          spot.getAttribute('data-name') || '';
      };

      // Open the map on a room. Answers whether there was a marker to open it
      // on, so a caller can tell the difference between done and nothing to do.
      window.sliceMapShowRoom = function(room) {
        const spot = spotForRoom(room);
        if (!spot) return false;

        // The map is the other pane of this page, so showing a room means
        // bringing that pane up first. The page script owns the switch.
        if (typeof window.sliceAppShowMap === 'function') window.sliceAppShowMap();

        goToSpot(spot);
        // The card carries the detail the popup leaves out, and on a phone the
        // list is short enough that it needs scrolling to
        revealCard(spot);

        // Whoever pressed the button by keyboard was standing on it, and it
        // has just gone with the panel - which would drop them back at the top
        // of the page. The marker takes tab focus, so hand them that instead.
        // preventScroll: the pane switch is already bringing it on screen, and
        // the browser's own scroll-into-view would fight it.
        try { spot.focus({ preventScroll: true }); } catch (e) { /* older focus() */ }

        return true;
      };

      // The pane this panel sits in has just come on screen, or the window
      // has changed shape: size the portrait layout against the window as it
      // is now and centre whichever floor is up.
      window.sliceMapRelayout = function() {
        layoutPortrait(true);
        const open = floors.filter(function(fl) { return !fl.hidden; })[0];
        if (open) centreFloor(open);
        // The re-measure moves every marker, so a popup already up is
        // re-anchored the same way the resize handler does it
        if (shownSpot) showPop(shownSpot);
      };
    })();
  </script>

  <script>
    // ===================== OVERLAY FOCUS =====================
    // The shared overlay raises its scrim without taking focus, which leaves
    // a keyboard user parked on a row they can no longer see. Wrapping the
    // openers lands them on the panel they just opened instead; Escape and
    // the scrim still close it the same way.
    (function() {
      ['openSessionOverlay', 'openSpeakerOverlay'].forEach(function(name) {
        const original = window[name];
        if (typeof original !== 'function') return;
        window[name] = function() {
          original.apply(this, arguments);
          // The phone's Back button closes what just opened - see the
          // history handling in the panes script below
          if (typeof window.sliceAppOverlayOpened === 'function') {
            window.sliceAppOverlayOpened();
          }
          const panel = document.querySelector(
            '#speakerOverlay .speaker-overlay__panel:not([hidden])');
          if (panel) {
            panel.setAttribute('tabindex', '-1');
            try { panel.focus({ preventScroll: true }); } catch (e) { panel.focus(); }
          }
        };
      });
    })();

    // ===================== THE TWO PANES =====================
    // The floating button flips between the schedule and the map. The CSS on
    // body.is-map does the travelling; this only turns the class and tells
    // the map to size itself now that it can be seen.
    (function() {
      const fab = document.getElementById('appFab');
      const schedulePane = document.getElementById('schedulePane');
      const mapPane = document.getElementById('mapPane');
      const overlay = document.getElementById('speakerOverlay');
      if (!fab || !schedulePane || !mapPane) return;

      let onMap = false;

      // The pane that has left keeps its scroll but leaves the tab order, so
      // keyboard focus cannot wander into something invisible
      function setAside(pane, aside) {
        if ('inert' in pane) pane.inert = aside;
      }
      setAside(mapPane, true);

      function showApp(which) {
        const map = which === 'map';
        if (map === onMap) return;
        onMap = map;

        document.body.classList.toggle('is-map', map);
        setAside(schedulePane, map);
        setAside(mapPane, !map);
        fab.classList.toggle('is-map', map);
        fab.setAttribute('aria-label', map ? 'Show the schedule' : 'Show the venue map');

        // The map measures itself against the window, and the reading it
        // took at parse time was with the address bar at full height. Take a
        // fresh one as the pane comes up.
        if (map && typeof window.sliceMapRelayout === 'function') {
          window.requestAnimationFrame(window.sliceMapRelayout);
        }
      }

      // ---- the phone's Back button ----
      // Opening the map or a session panel lays one state over the page, and
      // Back is how a phone puts a layer away. Each layer holds one history
      // entry, so Back closes it in place - same close the buttons do, no
      // reload, no navigation - and from the base page Back leaves as normal.
      // What is on top right now: 'base', 'overlay' or 'map'.
      let uiTop = 'base';

      // Back never scrolls anything here; the panes keep their own places
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }

      function overlayShown() {
        return !!(overlay && overlay.classList.contains('is-shown'));
      }

      window.addEventListener('popstate', function() {
        // Cleared first, so the class watcher below reads these closes as
        // already accounted for and does not pop a second entry
        uiTop = 'base';
        if (overlayShown()) {
          const close = document.getElementById('speakerClose');
          if (close) close.click();
        }
        if (onMap) showApp('schedule');
      });

      // A panel closed by hand - the scrim, Escape, the X - takes the
      // history entry it held with it, so the next Back is not a dud
      if (overlay && typeof MutationObserver === 'function') {
        let wasShown = overlayShown();
        new MutationObserver(function() {
          const shown = overlayShown();
          if (wasShown && !shown && uiTop === 'overlay') {
            uiTop = 'base';
            window.history.back();
          }
          wasShown = shown;
        }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
      }

      // The overlay openers say so here as they run - see the wrapping above
      window.sliceAppOverlayOpened = function() {
        if (uiTop !== 'base') return;
        window.history.pushState({ slice: 'overlay' }, '');
        uiTop = 'overlay';
      };

      fab.addEventListener('click', function() {
        // The scrim covers the button visually, but the keyboard can still
        // reach it - flipping panes under an open panel would be a mystery
        if (overlayShown()) return;
        if (onMap) {
          // Out through history, so this button and the phone's Back agree
          if (uiTop === 'map') {
            window.history.back();
            return;
          }
          showApp('schedule');
        } else {
          window.history.pushState({ slice: 'map' }, '');
          uiTop = 'map';
          showApp('map');
        }
      });

      // The session panel's map button asks for this before handing the room
      // to the floor map, so the pane is up by the time the marker is pinned.
      window.sliceAppShowMap = function() {
        if (uiTop === 'overlay') {
          // The panel is giving way to the map: one Back should undo the
          // pair, so the map takes over the panel's entry. The panel's own
          // close has already run, and the watcher above reads the new top
          // and leaves the entry to the map.
          window.history.replaceState({ slice: 'map' }, '');
          uiTop = 'map';
        } else if (uiTop !== 'map') {
          window.history.pushState({ slice: 'map' }, '');
          uiTop = 'map';
        }
        showApp('map');
      };
    })();

    // ===================== THE LIVE SCHEDULE =====================
    // The whole day from the one sheet, laid out once and always shown in
    // full. The slot that is running wears a Happening Now badge in its
    // pinned head - or a ticking countdown while the next one is still
    // coming - and the page opens scrolled straight to it.
    (function() {
      const statusEl = document.getElementById('appStatus');
      const doneEl = document.getElementById('dayDone');
      const listEl = document.getElementById('dayList');
      const pane = document.getElementById('schedulePane');
      const pastEl = document.getElementById('dayPast');
      const pastBtn = document.getElementById('dayPastBtn');
      const jumpBtn = document.getElementById('appJump');
      if (!listEl || !pane) return;

      // ---- the clock ----
      // The page is read on the day, so only the time of day matters. ?t=14:05
      // in the address bar pretends it is that time - for checking the states
      // ahead of the day - and keeps ticking from there.
      // The colon may arrive percent-encoded, and a minute past 59 is a typo
      // rather than a time - fall back to the real clock instead of misreading
      const parts = window.location.search.match(/[?&]t=(\d{1,2})(?::|%3[Aa])(\d{1,2})\b/);
      const asked = parts &&
        parseInt(parts[1], 10) < 24 && parseInt(parts[2], 10) < 60 ? parts : null;
      const askedFrom = asked ? Date.now() : 0;
      const askedBase = asked
        ? (parseInt(asked[1], 10) * 60 + parseInt(asked[2], 10)) * 60
        : 0;

      function daySeconds() {
        if (asked) return askedBase + Math.floor((Date.now() - askedFrom) / 1000);
        const now = new Date();
        return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      }

      let laid = [];
      // What the badge last said, so a tick that changes nothing redoes nothing
      let liveKey = null;
      // The ticking half of the countdown badge
      let clockEl = null;
      // Where the opening scroll parked the pane, so a later reflow can tell
      // whether the reader has moved off it since
      let autoScrolledTo = null;

      // ---- reading the day ----
      // Where the day stands: the slot running now, the one about to - with
      // how long to wait - or nothing left at all.
      function liveState() {
        const at = daySeconds();
        let running = null;
        let coming = null;

        laid.forEach(function(entry) {
          if (!entry.time) return;
          // The last slot to have started and not ended, matching how the
          // schedule itself files a session into slots
          if (entry.time.start <= at && at < entry.time.end) running = entry;
          if (entry.time.start > at &&
              (!coming || entry.time.start < coming.time.start)) coming = entry;
        });

        if (running) return { mode: 'now', entry: running, at: at, wait: 0 };
        if (coming) {
          return { mode: 'next', entry: coming, at: at, wait: coming.time.start - at };
        }
        return { mode: 'done', entry: null, at: at, wait: 0 };
      }

      // 12:34 for the usual gap, 1:02:34 for the long morning wait
      function clockText(seconds) {
        const wait = Math.max(0, seconds);
        const h = Math.floor(wait / 3600);
        const m = Math.floor((wait % 3600) / 60);
        const s = wait % 60;
        return (h ? h + ':' : '') +
          (h && m < 10 ? '0' : '') + m + ':' +
          (s < 10 ? '0' : '') + s;
      }

      // ---- showing it ----
      // The badge lives in the head of the slot it is about, so it pins to
      // the top of the screen along with the hours it belongs to
      function setLiveBadge(state) {
        listEl.querySelectorAll('.day-live-badge').forEach(function(badge) {
          badge.parentNode.removeChild(badge);
        });
        clockEl = null;

        if (!state.entry) return;
        const head = state.entry.block.querySelector('.schedule-slot__head');
        if (!head) return;

        const badge = document.createElement('span');
        badge.className = 'day-live-badge';

        if (state.mode === 'now') {
          badge.textContent = 'Happening Now';
        } else {
          badge.appendChild(document.createTextNode('Coming up in '));
          clockEl = document.createElement('span');
          clockEl.className = 'live__clock';
          clockEl.textContent = clockText(state.wait);
          badge.appendChild(clockEl);
          badge.appendChild(document.createTextNode('...'));
        }

        head.insertBefore(badge, head.firstChild);
      }

      // ---- the way back to now ----
      // A floating button at the foot of the screen whenever the slot that
      // is on has been scrolled out of view; one tap comes back to it. One
      // rect read per scroll event, deliberately not queued behind a frame
      // callback - see the same choice in the home page's map scroll work.
      let watchedBlock = null;

      // Centred when the label has room; otherwise against the left edge,
      // with the same margin the switch button keeps on the right. Measured
      // rather than broken by width, since the label changes with the day.
      function placeJump() {
        if (!jumpBtn || jumpBtn.hidden) return;
        const fab = document.getElementById('appFab');
        const fabLeft = fab
          ? fab.getBoundingClientRect().left
          : window.innerWidth - 90;
        const centredRight = (window.innerWidth + jumpBtn.offsetWidth) / 2;
        jumpBtn.classList.toggle('app-jump--left', centredRight > fabLeft - 12);
      }

      function updateJump() {
        if (!jumpBtn) return;
        if (!watchedBlock) {
          jumpBtn.hidden = true;
          return;
        }
        const box = watchedBlock.getBoundingClientRect();
        jumpBtn.hidden = box.bottom > 0 && box.top < window.innerHeight;
        placeJump();
      }

      window.addEventListener('resize', placeJump);

      function watchLive(state) {
        if (!jumpBtn) return;
        watchedBlock = state.entry ? state.entry.block : null;
        if (watchedBlock) {
          jumpBtn.textContent = state.mode === 'now'
            ? "See what's happening now"
            : "See what's coming up";
        }
        updateJump();
      }

      pane.addEventListener('scroll', updateJump, { passive: true });

      if (jumpBtn) {
        jumpBtn.addEventListener('click', function() {
          const state = liveState();
          if (!state.entry) return;
          const reduce = window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          pane.scrollTo({
            top: state.entry.block.offsetTop,
            behavior: reduce ? 'auto' : 'smooth'
          });
        });
      }

      function applyState(state) {
        if (doneEl) doneEl.hidden = state.mode !== 'done';
        setLiveBadge(state);
        watchLive(state);
      }

      function tick() {
        const state = liveState();
        const key = state.mode + '|' + (state.entry ? state.entry.at : '');

        if (key !== liveKey) {
          liveKey = key;
          applyState(state);
        } else if (state.mode === 'next' && clockEl) {
          clockEl.textContent = clockText(state.wait);
        }
      }

      // The whole day on screen the way Show All read it: the standing
      // fixtures gathered at the foot rather than repeated under every slot
      function showWholeDay() {
        laid.forEach(function(entry) {
          entry.block.hidden = false;
          entry.block.querySelectorAll('.schedule-room--allday')
            .forEach(function(block) { block.hidden = true; });
        });
      }

      // Park the pane so the live slot's head is pinned at the top
      function scrollToLive() {
        const state = liveState();
        if (!state.entry) return;
        autoScrolledTo = state.entry.block.offsetTop;
        pane.scrollTop = autoScrolledTo;
      }

      // Anything already over when the page opened folds away behind the
      // Show Past Sessions button, which sits above the live slot - just off
      // the top of the opening scroll, where scrolling up finds it
      function foldPast() {
        const at = daySeconds();
        const past = laid.filter(function(entry) {
          return entry.time && entry.time.end <= at;
        });
        if (!past.length || !pastEl) return;

        past.forEach(function(entry) {
          entry.past = true;
          entry.block.hidden = true;
        });
        pastEl.hidden = false;
      }

      if (pastBtn) {
        pastBtn.addEventListener('click', function() {
          // The reader keeps their place: everything unfolds above the first
          // slot that was already showing, so the pane is moved down by
          // exactly what grew in above it
          const anchor = laid.filter(function(entry) {
            return !entry.past;
          })[0];
          const before = anchor ? anchor.block.offsetTop : 0;

          laid.forEach(function(entry) {
            if (entry.past) entry.block.hidden = false;
          });
          if (pastEl) pastEl.hidden = true;

          const after = anchor ? anchor.block.offsetTop : 0;
          pane.scrollTop += after - before;
        });
      }

      // ---- filling it from the sheet ----
      function fail() {
        if (!statusEl) return;
        statusEl.hidden = false;
        statusEl.classList.add('section-status--failed');
        statusEl.textContent =
          'The schedule could not be loaded. Please try again in a moment.';
      }

      function fill(sessions) {
        laid = scheduleRender(sessions, listEl, null);

        // Which hours each laid-out slot covers. scheduleRender lays the
        // twelve slots out first and in order, so the pairing is by position;
        // the Time TBA and standing sections that can follow carry no clock.
        laid.forEach(function(entry, at) {
          entry.at = at;
          if (!entry.standing && at < SCHEDULE_SLOTS.length) {
            const def = SCHEDULE_SLOTS[at];
            entry.def = def;
            entry.time = {
              start: scheduleMinutes(def.start) * 60,
              end: scheduleMinutes(def.end) * 60
            };
            // The head speaks the page's compact way with hours -
            // "3:45 - 4:30pm" - which also leaves the badge room beside them
            const timeEl = entry.block.querySelector('.schedule-slot__time');
            if (timeEl) {
              timeEl.textContent =
                scheduleSlotStart(def) + ' - ' + scheduleSlotEnd(def);
            }
          }
        });

        showWholeDay();
        foldPast();

        if (statusEl) statusEl.hidden = true;

        tick();
        scrollToLive();

        window.setInterval(tick, 1000);
        // A phone coming back from the lock screen or another app has missed
        // its ticks; catch the page up the moment it is looked at again
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) tick();
        });

        // Bungee lands after the first layout and moves everything. As long
        // as the reader has not scrolled off on their own, park the pane on
        // the live slot again once the type has settled.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            if (autoScrolledTo !== null &&
                Math.abs(pane.scrollTop - autoScrolledTo) < 4) {
              scrollToLive();
            }
          });
        }
      }

      const loadingSpeakers = loadSpeakers(SCHEDULE_DEFAULTS.speakersSheet, function(speakers) {
        // No speakers means nothing can pass the seat check in loadSessions
        if (!speakers || !speakers.length) {
          fail();
          return;
        }

        const loading = loadSessions(SCHEDULE_DEFAULTS.sheet, speakers, function(sessions) {
          if (!sessions.length) {
            fail();
            return;
          }
          fill(sessions);
        }, { requireSynopsis: false });

        if (loading && typeof loading.catch === 'function') {
          loading.catch(function(err) {
            console.error('Could not load the session sheet', err);
            fail();
          });
        }
      });

      if (loadingSpeakers && typeof loadingSpeakers.catch === 'function') {
        loadingSpeakers.catch(function(err) {
          console.error('Could not load the speaker sheet', err);
          fail();
        });
      }
    })();
  </script>
</body>
</html>
