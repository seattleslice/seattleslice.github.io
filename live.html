        marqueeEl.hidden = !up;
        document.body.classList.toggle('tv-evening', up);
        if (up) paceRibbon();
        // The board reads a resize as "measure the room again", which is
        // exactly what losing or regaining the bottom band calls for
        window.dispatchEvent(new Event('resize'));
      }

      // ---- the supercut film ----
      const FILM_SRC = 'videos/six_supercut.mp4';
      const FILM_FIRST = 18 * 3600 + 40 * 60;
      const FILM_LAST = 21 * 3600 + 20 * 60;
      const FILM_EVERY = 5 * 60;
      // The film is ~100MB: it starts downloading half an hour before its
      // first showing, so even slow venue wifi has it whole in time
      const FILM_FETCH_AHEAD = 30 * 60;
      const FILM_JOIN_SLACK = 2;

      const filmEl = document.getElementById('tvFilm');
      // Belt and braces with the muted attribute: a muted film is allowed
      // to start without anybody having touched the page
      filmEl.muted = true;
      filmEl.preload = 'auto';
      // When the showing on screen began, for the stall watchdog below
      let filmShowingAt = null;

      filmEl.addEventListener('ended', function() {
        filmEl.hidden = true;
      });
      filmEl.addEventListener('error', function() {
        filmEl.hidden = true;
      });

      // Fetched whole like the audio clips and then kept - it shows every
      // five minutes all evening. While the blob is still out of reach the
      // element streams from the src instead, and the fetch keeps retrying
      // quietly in the background until it lands.
      let filmBlobUrl = null;
      let filmFetching = false;
      let filmNextTry = 0;

      function fetchFilm() {
        if (filmBlobUrl || filmFetching) return;
        if (Date.now() < filmNextTry) return;
        filmFetching = true;
        fetch(FILM_SRC).then(function(res) {
          if (!res.ok) throw new Error(FILM_SRC + ' answered ' + res.status);
          return res.blob();
        }).then(function(blob) {
          filmFetching = false;
          filmBlobUrl = URL.createObjectURL(blob);
          // Never yank the src out from under a showing in progress; the
          // next playFilm swaps over between showings
          if (filmEl.hidden) filmEl.src = filmBlobUrl;
        }).catch(function() {
          filmFetching = false;
          filmNextTry = Date.now() + 60000;
          if (!filmEl.src) filmEl.src = FILM_SRC;
        });
      }

      function playFilm(at) {
        // The best source to hand: the whole file if the fetch has
        // landed, the stream if not
        if (filmBlobUrl) {
          if (filmEl.src !== filmBlobUrl) filmEl.src = filmBlobUrl;
        } else if (!filmEl.src) {
          filmEl.src = FILM_SRC;
        }

        function begin() {
          // Behind its mark - a reload, a stalled load - the film joins
          // in progress, and past its own end it stays away
          const behind = Math.max(0, daySeconds() - at);
          if (behind > FILM_JOIN_SLACK) {
            if (!isFinite(filmEl.duration) ||
                behind >= filmEl.duration - 0.25) return;
            filmEl.currentTime = behind;
          } else {
            filmEl.currentTime = 0;
          }
          filmShowingAt = at;
          filmEl.hidden = false;
          const showing = filmEl.play();
          if (showing && showing.catch) {
            showing.catch(function() {
              filmEl.hidden = true;
            });
          }
        }

        if (filmEl.readyState >= 1) begin();
        else filmEl.addEventListener('loadedmetadata', begin, { once: true });
      }

      // A page opened mid-evening rejoins the showing in progress partway
      // through, rather than restarting or skipping it; playFilm drops it
      // on its own if that showing is already over
      let filmNextAt = FILM_FIRST;
      {
        const now = daySeconds();
        if (now >= FILM_FIRST) {
          const last = FILM_FIRST +
            Math.floor((now - FILM_FIRST) / FILM_EVERY) * FILM_EVERY;
          filmNextAt = last + FILM_EVERY;
          if (last <= FILM_LAST) playFilm(last);
        }
      }

      function eveningTick() {
        const now = daySeconds();
        ribbonTick(now);
        // Retries never launch during a showing - a fresh 97MB fetch must
        // not fight the stream on screen for bandwidth. One already in
        // flight keeps going: it is the swap-to-blob rescue.
        if (filmEl.hidden &&
            now >= FILM_FIRST - FILM_FETCH_AHEAD && now <= FILM_LAST) {
          fetchFilm();
        }
        // The stall watchdog. A showing that freezes - a stream on wifi
        // that gave out - fires no ended and no error, and would sit
        // covering the board; once the clock is past the film's own end,
        // the screen goes back to the schedule.
        if (!filmEl.hidden && filmShowingAt !== null) {
          const over = filmShowingAt +
            (isFinite(filmEl.duration) ? filmEl.duration : FILM_EVERY) + 5;
          if (now > over) {
            filmEl.pause();
            filmEl.hidden = true;
          }
        }
        if (filmNextAt <= FILM_LAST && now >= filmNextAt) {
          let at = filmNextAt;
          // Should the clock have jumped a few marks - a long throttle, a
          // stall - only the latest due showing is worth joining
          while (filmNextAt + FILM_EVERY <= now && filmNextAt < FILM_LAST) {
            filmNextAt += FILM_EVERY;
            at = filmNextAt;
          }
          filmNextAt += FILM_EVERY;
          playFilm(at);
        }
      }
      window.setInterval(eveningTick, 1000);
      eveningTick();
    })();
  </script>

  <script>
    // ===================== FULLSCREEN =====================
    // The hallway TVs are set up by the venue's AV crew, who open the page
    // and walk away - nobody thinks to press F11, and the browser's header
    // has no place on a schedule board. So the board asks for the screen
    // itself: once outright on load, which a browser normally refuses
    // without a person behind the request, and then again on the first
    // click or key press, which it honours. Until one of those lands, the
    // corner hint says what to press.
    //
    // F11 is not the fullscreen API and sets no fullscreenElement, so
    // being full screen is also read off the window filling the display -
    // a TV already set up right, by F11 or a kiosk shell, never shows the
    // hint at all.
    (function() {
      const hint = document.getElementById('fullscreenHint');
      const root = document.documentElement;

      function isFullscreen() {
        if (document.fullscreenElement) return true;
        // A window that has no size yet answers 0 for everything, and 0 of
        // 0 must not read as filling the screen
        return window.innerWidth > 0 && window.innerHeight > 0 &&
          window.innerWidth >= screen.width - 2 &&
          window.innerHeight >= screen.height - 2;
      }

      function askForScreen() {
        if (isFullscreen()) return;
        if (root.requestFullscreen) {
          const asking = root.requestFullscreen({ navigationUI: 'hide' });
          // Refusal is the expected answer until somebody presses something
          if (asking && asking.catch) asking.catch(function() {});
        } else if (root.webkitRequestFullscreen) {
          root.webkitRequestFullscreen();
        }
      }

      function updateHint() {
        const up = isFullscreen();
        if (hint) hint.hidden = up;
        // The pointer is hidden on this page - nobody points at a TV - but
        // somebody who has to click wants to see what they are aiming
        document.body.classList.toggle('tv-windowed', !up);
      }

      askForScreen();

      // Any press will do. Escape is how somebody leaves fullscreen on
      // purpose, so it alone never asks for the screen back.
      document.addEventListener('click', askForScreen);
      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') askForScreen();
      });

      document.addEventListener('fullscreenchange', updateHint);
      window.addEventListener('resize', updateHint);
      updateHint();

      // Pulsing all day would make the corner the loudest thing on the
      // board; two minutes is plenty to catch the eye of whoever set it up
      if (hint) {
        window.setTimeout(function() {
          hint.classList.add('is-settled');
        }, 2 * 60 * 1000);
      }
    })();
  </script>
