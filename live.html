<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SLICE 2026 Live Schedule</title>
  <meta name="description" content="The live SLICE 2026 schedule board: what's happening now and what's coming up.">
  <!-- A hallway fixture, not a destination -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00367B">

  <link rel="icon" href="favicon.ico" sizes="any">

  <style>
    /* The faces bundled beside the page rather than fetched from Google:
       the venue's computers may have no internet, and this board still has
       to look like SLICE. Same files the Google CSS would have served. */
    @font-face {

      font-style: normal;

      src: url('fonts/bungee-400-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Bungee';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/bungee-400-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Lato';
      font-style: italic;

      src: url('fonts/lato-400-italic-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Lato';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/lato-400-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Lato';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/lato-400-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Lato';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/lato-700-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Lato';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/lato-700-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ===================== THE BOARD =====================
       One screen, drawn for the hallway TVs: 16:9 mostly, 16:10 sometimes.
       Everything is sized in rem, and the rem is a slice of the screen's
       height scaled by --fit - which the script lowers until the fullest
       slot of the day sits inside the frame. It is put up at the start of
       the day and left alone: the script keeps it current on its own. */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: calc(1.9vh * var(--fit, 1));
    }

    body {
      font-family: 'Lato', sans-serif;
      background: #00367B;
      color: #ffffff;
      overflow: hidden;
      /* Nobody is pointing at a hallway TV */
      cursor: none;
    }

    .tv {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- the two band headers ---- */
    .tv-band {
      position: relative;
      flex: 0 0 auto;
      padding: 1rem 6rem 1.1rem;
      background: #001a3d;
      text-align: center;
    }

    .tv-band__title {
      font-family: 'Bungee', cursive;
      font-size: 2.4rem;
      line-height: 1.15;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f5ee1d;
      text-shadow: 0.12rem -0.12rem 0 #BB3EFD;
    }

    .tv-band__hours {
      margin-top: 0.2rem;
      font-size: 1.15rem;
      color: #ffffff;
    }

    .tv-band__hours[hidden] {
      display: none;
    }

    /* The ticking half of "starts in 12:34" */
    .tv-band__hours .tick {
      font-variant-numeric: tabular-nums;
      color: #a0c4e8;
    }

    /* ---- the content areas between the bands ---- */
    .tv-now,
    .tv-coming {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 3rem;
      min-height: 0;
      /* Anything the fit floor still cannot hold clips inside its own box
         rather than painting over the band headers */
      overflow: hidden;
    }

    /* Whichever section carries the detail takes the room; see tv--nowlite */
    .tv-now {
      flex: 1 1 auto;
    }

    .tv-coming {
      flex: 0 0 auto;
    }

    .tv--nowlite .tv-now {
      flex: 0 0 auto;
      padding: 1.6rem 3rem;
    }

    .tv--nowlite .tv-coming {
      flex: 1 1 auto;
    }

    /* ---- a slot laid out in full: balanced columns of cards ---- */
    .tv-cols {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 2rem 4rem;
      width: 100%;
      max-width: 96rem;
    }

    .tv-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.7rem;
    }

    /* One session, said the way the posters said it: title, room, names */
    .tv-session {
      text-align: center;
    }

    .tv-session__title {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 0 0.12rem 0.35rem rgba(0, 10, 30, 0.45);
    }

    /* A fixture the Now section is already showing but that has not opened
       its doors yet - the speed networking, up from half past six for its
       seven o'clock start. Yellow, small, and gone the moment it begins. */
    .tv-session__soon {
      margin-left: 0.4rem;
      font-size: 0.62em;
      font-weight: 700;
      color: #f5ee1d;
      white-space: nowrap;
    }

    .tv-session__room {
      margin-top: 0.15rem;
      font-size: 1.2rem;
      line-height: 1.3;
      color: #f5ee1d;
    }

    .tv-session__names {
      margin-top: 0.2rem;
      font-size: 1.1rem;
      line-height: 1.35;
      font-style: italic;
      color: #c0d8f0;
    }

    .tv-session__note {
      margin: 0.5rem auto 0;
      max-width: 42rem;
      font-size: 1.15rem;
      line-height: 1.5;
      color: #c0d8f0;
    }

    /* A run of short things under one name - roundtables, micro-talks */
    .tv-group {
      text-align: center;
    }

    .tv-group__list {
      margin-top: 0.6rem;
      list-style: none;
      display: inline-block;
      text-align: left;
    }

    .tv-group__list li {
      font-size: 1.15rem;
      line-height: 1.35;
      padding: 0.28rem 0;
    }

    .tv-group__mark {
      color: #BB3EFD;
      font-size: 0.85em;
      margin-right: 0.45rem;
    }

    .tv-group__when {
      color: #f5ee1d;
      font-variant-numeric: tabular-nums;
      margin-right: 0.35rem;
    }

    /* Which table, for the blocks that are a run of them */
    .tv-group__table {
      color: #dcb0ff;
      font-weight: 700;
    }

    /* The names hold together: either they fit after the title, or the
       whole run of them starts the next line */
    .tv-group__who {
      font-style: italic;
      color: #c0d8f0;
      white-space: nowrap;
    }

    .tv-name {
      white-space: nowrap;
    }

    /* ---- the light layouts: fixtures between slots, big single words ---- */
    .tv-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem 7rem;
      flex-wrap: wrap;
      width: 100%;
    }

    /* ---- the other section said small: one line per thing ---- */
    .tv-brief {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 3.4rem;
      max-width: 92rem;
    }

    .tv-brief li {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .tv-brief .where {
      font-weight: 400;
      font-size: 0.85em;
      color: #f5ee1d;
      margin-left: 0.55rem;
      white-space: nowrap;
    }

    /* ---- the corner clock, riding the centre line of the top band ---- */
    .tv-clock {
      position: absolute;
      top: 50%;
      right: 1.6rem;
      transform: translateY(-50%);
      font-size: 2.3rem;
      font-variant-numeric: tabular-nums;
      color: #8ab4e0;
    }

    /* ---- the week's other shows, pitched through the after-party ---- */
    /* Three even columns: titles along the top, QR codes along the bottom,
       whatever their descriptions run to in between */
    .tv-promos {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 2rem 4rem;
      width: 100%;
      max-width: 92rem;
    }

    .tv-promo {
      flex: 1 1 0;
      max-width: 26rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.4rem;
    }

    /* The codes carry their own darker ground over this lighter blue, so
       they get softly rounded corners rather than hard tile edges */
    .tv-promo__qr {
      margin-top: auto;
      width: 12rem;
      height: 12rem;
      border-radius: 0.9rem;
    }

    /* ---- the countdown takeover: the last two minutes before a block ---- */
    /* The Now section stands down, the countdown takes the top billing at a
       bigger size, and the next slot keeps the whole screen below it */
    .tv--countdown .tv-band--now,
    .tv--countdown .tv-now {
      display: none;
    }

    .tv--countdown .tv-coming {
      flex: 1 1 auto;
    }

    .tv--countdown .tv-band__title {
      font-size: 3rem;
    }

    /* The number: nudged a little larger with every passing second... */
    .tv-count {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* ...and pulsing once per tick on top of that */
    .tv-count__pulse {
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    .tv-count__pulse.is-ticking {
      animation: tvCountPulse 0.45s ease;
    }

    @keyframes tvCountPulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }

    /* ---- the website's hero robot, in for the countdown ---- */
    .tv-robot {
      position: fixed;
      bottom: -2vh;
      right: 0;
      width: clamp(180px, 17vw, 400px);
      z-index: 10;
      transform: translateX(115%);
      transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    .tv-robot.entered {
      transform: translateX(11%);
    }

    .tv-robot__rig {
      position: relative;
      width: 100%;
      transform-origin: 60.85% 98.7%;
    }

    .tv-robot__body {
      display: block;
      width: 100%;
      height: auto;
    }

    .tv-robot__arm {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      transform-origin: 34% 74.2%;
    }

    /* ---- lunch, front and centre for its first hour ---- */
    .tv-lunch {
      max-width: 72rem;
      text-align: center;
    }

    .tv-lunch__title {
      font-family: 'Bungee', cursive;
      font-size: 3.2rem;
      line-height: 1.2;
      letter-spacing: 0.1em;
      color: #f5ee1d;
      text-shadow: 0.14rem -0.14rem 0 #BB3EFD;
      margin-bottom: 1.2rem;
    }

    .tv-lunch__note {
      font-size: 1.9rem;
      line-height: 1.55;
      color: #ffffff;
      text-shadow: 0 0.12rem 0.35rem rgba(0, 10, 30, 0.45);
    }

    /* The note's restaurant names arrive as links. Nobody can click a
       hallway TV, so they read as highlighted places instead - and since
       the fullscreen hint tells whoever sets the TV up to click anywhere,
       they are made inert outright: a click on one must ask for the
       screen, not put Google Maps up over the board. */
    .tv-session__note a,
    .tv-lunch__note a {
      color: #f5ee1d;
      font-weight: 700;
      text-decoration: none;
      pointer-events: none;
    }

    /* The goodnight line, once the hall has emptied */
    .tv-closed {
      max-width: 60rem;
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0.12rem 0.35rem rgba(0, 10, 30, 0.45);
    }

    /* ---- waiting on the sheet ---- */
    .tv-status {
      font-family: 'Bungee', cursive;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: #8ab4e0;
      animation: tvPulse 1.4s ease-in-out infinite;
    }

    @keyframes tvPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    /* ---- the evening: the sponsor ribbon and the supercut film ---- */
    /* Through the after-party the bottom 15% of the screen is a ribbon of
       sponsor logos looping past a thank-you, and the board above gives up
       the room - see body.tv-evening and the EVENING module. */
    .tv-marquee {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 15vh;
      background: #001a3d;
      overflow: hidden;
      /* Under the corner hints, which somebody may still need to read,
         and under the robot, who is welcome to stand in front */
      z-index: 9;
    }

    .tv-marquee[hidden] {
      display: none;
    }

    /* Two identical reels ride one track; the animation slides the track
       exactly one reel to the left and starts over, so the seam between
       the copies never shows. The EVENING module sets --mq-secs from the
       reel's real width, keeping the pace steady on any screen. */
    .tv-marquee__track {
      display: flex;
      align-items: center;
      height: 100%;
      width: max-content;
      will-change: transform;
      animation: tvMarquee var(--mq-secs, 60s) linear infinite;
    }

    @keyframes tvMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .tv-marquee__reel {
      display: flex;
      align-items: center;
    }

    /* Sized off the screen rather than the board's rem: the ribbon holds
       its scale however far the fit loop shrinks a crowded slot */
    .tv-marquee__thanks {
      font-family: 'Bungee', cursive;
      font-size: 5vh;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #f5ee1d;
      text-shadow: 0.25vh -0.25vh 0 #BB3EFD;
      margin: 0 7vh;
    }

    /* The logos keep the main page's widths - settled there for equal
       optical area per tier - scaled so the tallest still clears the band.
       Same floating treatment as the sponsor wall: transparent art over
       the navy, held by a soft shadow. */
    .tv-marquee__logo {
      width: calc(var(--w) * 0.09vh);
      margin: 0 3vh;
      filter: drop-shadow(0 0.4vh 1vh rgba(0, 0, 0, 0.45));
    }

    /* The board hands the ribbon its 15% and reflows into the rest */
    body.tv-evening .tv {
      height: 85vh;
    }

    /* ---- the supercut film, every five evening minutes ---- */
    /* Over everything, hints included: the screen is the film's while it
       runs. The board keeps ticking underneath - the music, the clocks -
       and is simply revealed again when the film ends. */
    .tv-film {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      object-fit: contain;
      z-index: 30;
    }

    .tv-film[hidden] {
      display: none;
    }

    /* ---- the fullscreen hint ---- */
    /* Up only while the browser's chrome is still on screen - see the
       FULLSCREEN module at the end of the page. Small enough to ignore
       from the hallway, plain enough to follow from the AV cart. */
    .tv-fullscreen-hint {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      /* Above the robot, which wheels into this same corner for the
         two minutes before a block and would paint over the words */
      z-index: 11;
      padding: 0.55rem 0.9rem;
      background: #001a3d;
      border: 0.09rem solid #8ab4e0;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      color: #a0c4e8;
      animation: tvPulse 1.4s ease-in-out infinite;
    }

    .tv-fullscreen-hint[hidden] {
      display: none;
    }

    /* It has pulsed long enough to be noticed by anybody setting the TV
       up; after that it just sits quietly for whoever walks past later */
    .tv-fullscreen-hint.is-settled {
      animation: none;
      opacity: 0.75;
    }

    /* The sound twin of the hint above, in the opposite corner: up only
       when the browser refuses to play a clip until somebody touches the
       page - see the AUDIO module below */
    .tv-sound-hint {
      right: auto;
      left: 1rem;
    }

    /* The pointer comes back while somebody may need to aim a click */
    body.tv-windowed {
      cursor: default;
    }
  </style>
</head>
<body>

  <main class="tv" id="stage">
    <header class="tv-band tv-band--now" id="nowBand">
      <h1 class="tv-band__title">Happening Now</h1>
      <p class="tv-band__hours" id="nowHours" hidden></p>
      <p class="tv-clock" id="tvClock"></p>
    </header>
    <section class="tv-now" id="nowContent">
      <p class="tv-status">Loading...</p>
    </section>
    <header class="tv-band" id="comingBand">
      <h2 class="tv-band__title" id="comingTitle">Coming Up...</h2>
      <p class="tv-band__hours" id="comingHours" hidden></p>
    </header>
    <section class="tv-coming" id="comingContent"></section>
  </main>

  <!-- Up while the page is windowed - see the FULLSCREEN module below -->
  <div class="tv-fullscreen-hint" id="fullscreenHint" hidden>
    Click anywhere or press any key for full screen</div>

  <!-- Up only if a clip came due while the browser still refuses to make
       a sound - see the AUDIO module below -->
  <div class="tv-fullscreen-hint tv-sound-hint" id="soundHint" hidden>
    Click anywhere or press any key to enable sound</div>

  <!-- The website's hero robot, wheeling in for the last two minutes before
       a session block starts -->
  <div class="tv-robot" id="tvRobot" aria-hidden="true">
    <div class="tv-robot__rig" id="tvRobotRig">
      <img class="tv-robot__body" src="images/robot/v1/body.png" alt="" draggable="false">
      <img class="tv-robot__arm" id="tvRobotArm" src="images/robot/v1/arm.png" alt="" draggable="false">
    </div>
  </div>

  <!-- The evening's fixtures: the sponsor thank-you ribbon and the SIX
       supercut film - see the EVENING module below -->
  <div class="tv-marquee" id="tvMarquee" aria-hidden="true" hidden>
    <div class="tv-marquee__track" id="tvMarqueeTrack"></div>
  </div>
  <video class="tv-film" id="tvFilm" muted playsinline hidden></video>

  <!-- schedule.js for the slot table, the sheet parsing and the room names;
       shared.js for the sheet loaders. Neither builds anything here - this
       page has none of the elements they go looking for. -->
  <script src="js/schedule.js?v=2026-08-26"></script>
  <script src="js/shared.js?v=2026-08-30"></script>
  <!-- The day frozen to disk, for a venue computer with no internet -->
  <script src="js/schedule-snapshot.js?v=2026-08-30"></script>

  <script>
    // ===================== THE LIVE BOARD =====================
    // Reads the clock, shows the slot that is running in full and the next
    // one small - or the other way round between slots, when the standing
    // fixtures hold the fort and the next slot gets the room. Refetches the
    // sheet every five minutes so a dropped speaker or a moved session
    // reaches the hallways mid-day, and keeps whatever it already has when
    // a fetch fails.
    (function() {
      const stage = document.getElementById('stage');
      const nowBandEl = document.getElementById('nowBand');
      const comingBandEl = document.getElementById('comingBand');
      const nowHoursEl = document.getElementById('nowHours');
      const nowContentEl = document.getElementById('nowContent');
      const comingTitleEl = document.getElementById('comingTitle');
      const comingHoursEl = document.getElementById('comingHours');
      const comingContentEl = document.getElementById('comingContent');
      const clockEl = document.getElementById('tvClock');

      // ---- the clock ----
      // Only the time of day matters. ?t=14:05 pretends it is that time, for
      // checking the day's states ahead of the day, and ticks on from there.
      // ?offline pretends the sheet is unreachable, for checking the
      // bundled fallback without pulling any cables
      const offlineTest = /[?&]offline\b/.test(window.location.search);

      const parts = window.location.search.match(/[?&]t=(\d{1,2})(?::|%3[Aa])(\d{1,2})\b/);
      const asked = parts &&
        parseInt(parts[1], 10) < 24 && parseInt(parts[2], 10) < 60 ? parts : null;
      const askedFrom = asked ? Date.now() : 0;
      const askedBase = asked
        ? (parseInt(asked[1], 10) * 60 + parseInt(asked[2], 10)) * 60
        : 0;

      function daySeconds() {
        if (asked) return askedBase + Math.floor((Date.now() - askedFrom) / 1000);
        const now = new Date();
        return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      }

      // The audio and evening modules further down read this same clock,
      // pretend time and all
      window.tvDaySeconds = daySeconds;

      // "2:45 pm", the way the posters wrote it
      function clockLower(minutes) {
        return scheduleClock(minutes).toLowerCase();
      }

      function hoursText(def) {
        return clockLower(scheduleMinutes(def.start)) + ' - ' +
          clockLower(scheduleMinutes(def.end));
      }

      // 12:34, or 1:02:34 across the morning
      function waitText(seconds) {
        const wait = Math.max(0, seconds);
        const h = Math.floor(wait / 3600);
        const m = Math.floor((wait % 3600) / 60);
        const s = wait % 60;
        return (h ? h + ':' : '') +
          (h && m < 10 ? '0' : '') + m + ':' +
          (s < 10 ? '0' : '') + s;
      }

      // ---- the standing fixtures, for the stretches between slots ----
      // Windows restated from SCHEDULE_FIXTURES in js/schedule.js, with the
      // short names the hallway posters used. Keep the two in step by hand.
      const TV_FIXTURES = [
        { title: 'Playtesting Club', place: 'Level 1 Lobby', from: '8:00 AM', until: '9:30 PM' },
        { title: 'Creative Clinic', place: 'Level 1 - See Map', from: '10:00 AM', until: '5:00 PM' },
        { title: 'Coffee', place: 'Level 2 Lobby', from: '8:00 AM', until: '10:30 AM' },
        { title: 'Speed Networking', place: 'Level 1 Café', from: '7:00 PM', until: '8:00 PM' }
      ];

      function fixturesAt(minute) {
        return TV_FIXTURES.filter(function(fixture) {
          return scheduleMinutes(fixture.from) <= minute &&
            minute < scheduleMinutes(fixture.until);
        });
      }

      // The fixtures a stretch of the day will see: anything whose window
      // overlaps it, for a slot being shown whole rather than at one moment
      function fixturesIn(fromMinute, toMinute) {
        return TV_FIXTURES.filter(function(fixture) {
          return scheduleMinutes(fixture.from) < toMinute &&
            fromMinute < scheduleMinutes(fixture.until);
        });
      }

      // Where a room is, floor included: a hallway TV explains itself or
      // not at all, and the schedule page's names carry no floors
      const TV_ROOM_LEVELS = {
        'Auditorium': 'Auditorium (Level 2)',
        'Lecture Hall': 'Lecture Hall (Basement)',
        'Allen Room': 'Allen Room (Level 4)',
        'Norcliffe Room': 'Norcliffe Room (Level 4)'
      };

      function tvRoomText(text) {
        return TV_ROOM_LEVELS[text] || text || '';
      }

      let sessions = [];
      let lastKey = null;
      // What the sheet last amounted to, so an unchanged answer redraws
      // nothing - see refresh
      let sessionsStamp = null;
      let tickEl = null;
      let tickBase = 0;
      // The two halves of the takeover countdown's number
      let countEl = null;
      let countPulseEl = null;

      // ---- the robot ----
      // The website's hero robot rolls in for the countdown and keeps up the
      // rock and wave the home page gives it, the whole time it holds
      const robotEl = document.getElementById('tvRobot');
      const robotRig = document.getElementById('tvRobotRig');
      const robotArm = document.getElementById('tvRobotArm');
      let robotFrame = 0;
      let robotRest = 0;

      function robotTick(now) {
        const t = now / 1000;
        robotRig.style.transform =
          'rotate(' + (Math.sin(t * 2.1) * 3).toFixed(2) + 'deg)';
        robotArm.style.transform =
          'rotate(' + (Math.sin(t * 3.4 + 0.6) * 12 - 5).toFixed(2) + 'deg)';
        robotFrame = window.requestAnimationFrame(robotTick);
      }

      function setRobot(on) {
        if (!robotEl || !robotRig || !robotArm) return;
        if (on === robotEl.classList.contains('entered')) return;
        robotEl.classList.toggle('entered', on);
        window.clearTimeout(robotRest);
        if (on) {
          if (!robotFrame) robotFrame = window.requestAnimationFrame(robotTick);
        } else {
          // Still waving while he rolls off; the loop rests once he is gone
          robotRest = window.setTimeout(function() {
            window.cancelAnimationFrame(robotFrame);
            robotFrame = 0;
          }, 2000);
        }
      }

      // ---- reading the sheet into a slot ----
      // The sittings that land in a slot, gathered into the schedule's own
      // blocks: one per big room, one for the roundtables, one for the
      // breakfast tables - the same filing scheduleRender does.
      function gatherSlot(def) {
        const blocks = new Map();

        sessions.forEach(function(session) {
          scheduleSittings(session.time, session.room).forEach(function(sitting) {
            if (scheduleSlotFor(sitting.startsAt) !== def) return;

            const key = scheduleBlockKey(sitting.room);
            let block = blocks.get(key);
            if (!block) {
              block = { key: key, order: scheduleBlockOrder(sitting.room), items: [] };
              blocks.set(key, block);
            }
            block.items.push({
              session: session,
              startsAt: sitting.startsAt,
              room: sitting.room
            });
          });
        });

        const laid = Array.from(blocks.values());
        laid.forEach(function(block) {
          block.items.sort(function(a, b) {
            if (a.startsAt !== b.startsAt) return a.startsAt - b.startsAt;
            return String(a.room).localeCompare(String(b.room));
          });
        });
        laid.sort(function(a, b) { return a.order - b.order; });
        return laid;
      }

      // What a block of several is called, and where it is - "Roundtables"
      // over "Level 5 Lobby", the breakfast under its own event's name
      function groupTitle(block) {
        const entry = scheduleRoomEntry(block.key);
        if (entry && entry.heading) {
          return { name: entry.heading, room: entry.name };
        }

        const format = scheduleFormatKey(block.items[0].session.format);
        const same = block.items.every(function(item) {
          return scheduleFormatKey(item.session.format) === format;
        });

        if (same && SCHEDULE_GROUPS[format]) {
          const said = SCHEDULE_GROUPS[format].split(' - ');
          const known = scheduleRoomEntry(block.key);
          return {
            name: said[0],
            // A room the tables know nothing of still says its code, the way
            // the schedule page does, rather than showing nowhere at all
            room: tvRoomText(known
              ? (said[1] || known.name || '')
              : scheduleRoomPlace(block.items[0].room))
          };
        }

        return null;
      }

      function names(session) {
        return session.speakers.map(function(speaker) {
          return speaker.name;
        }).join(', ');
      }

      // ---- building the pieces ----
      function el(tag, className, text) {
        const made = document.createElement(tag);
        if (className) made.className = className;
        if (text) made.textContent = text;
        return made;
      }

      function sessionCard(item, withTime) {
        const card = el('article', 'tv-session');
        card.appendChild(el('h3', 'tv-session__title', item.session.title));

        const room = tvRoomText(scheduleRoomPlace(item.room));
        const when = withTime ? clockLower(Math.floor(item.startsAt)) : '';
        card.appendChild(el('p', 'tv-session__room',
          room + (when ? ' · ' + when : '')));

        // One unbreakable span per name: a line may break between people,
        // never through the middle of somebody
        if (item.session.speakers.length) {
          const who = el('p', 'tv-session__names');
          item.session.speakers.forEach(function(speaker, at) {
            if (at) who.appendChild(document.createTextNode(', '));
            who.appendChild(el('span', 'tv-name', speaker.name));
          });
          card.appendChild(who);
        }
        return card;
      }

      function groupCard(block, title, withTimes) {
        const card = el('article', 'tv-group');
        card.appendChild(el('h3', 'tv-session__title', title.name));
        if (title.room) card.appendChild(el('p', 'tv-session__room', title.room));

        const list = el('ul', 'tv-group__list');
        block.items.forEach(function(item) {
          const li = el('li');
          li.appendChild(el('span', 'tv-group__mark', '▶'));
          if (withTimes) {
            li.appendChild(el('span', 'tv-group__when', clockLower(item.startsAt)));
          }
          // Which of the tables, for the blocks that are a run of them -
          // six topics run at once, and the letter is how a reader finds one
          const letter = scheduleTableLetter(item.room);
          if (letter) {
            li.appendChild(el('span', 'tv-group__table', letter + ': '));
          }
          li.appendChild(document.createTextNode(item.session.title));
          const who = names(item.session);
          if (who) li.appendChild(el('span', 'tv-group__who', ' - ' + who));
          list.appendChild(li);
        });
        card.appendChild(list);
        return card;
      }

      // `nowMinute` is the clock the card is being shown against, and only
      // the Now section passes it: a label slot lists every fixture its whole
      // stretch will see, so one can go up before it has started. That one
      // says "(soon)" until it does. The Coming Up preview leaves the minute
      // out - everything there is soon.
      function fixtureCard(fixture, nowMinute) {
        const card = el('article', 'tv-session');
        const title = el('h3', 'tv-session__title', fixture.title);
        if (typeof nowMinute === 'number' &&
            nowMinute < scheduleMinutes(fixture.from)) {
          title.appendChild(el('span', 'tv-session__soon', '(soon)'));
        }
        card.appendChild(title);
        card.appendChild(el('p', 'tv-session__room', fixture.place));
        card.appendChild(el('p', 'tv-session__names',
          clockLower(scheduleMinutes(fixture.from)) + ' - ' +
          clockLower(scheduleMinutes(fixture.until))));
        return card;
      }

      // A block of one is a card; a run under one name is a list; a run
      // under no name - two talks sharing a room - is a card per talk with
      // its start beside the room.
      function blockCards(block, slotStart) {
        // Times show whenever something does not start with the slot - the
        // same rule the schedule page reads by
        const offStart = block.items.some(function(item) {
          return item.startsAt !== slotStart;
        });

        // A block that is a run of tables keeps its heading and letters even
        // when only one sitting landed in this slot
        const entry = scheduleRoomEntry(block.key);
        if (block.items.length === 1 && !(entry && entry.rooms)) {
          return [sessionCard(block.items[0], offStart)];
        }

        const title = groupTitle(block);
        if (title) return [groupCard(block, title, offStart)];

        return block.items.map(function(item) {
          return sessionCard(item, offStart);
        });
      }

      // The cards in two columns, kept in room order and split where the
      // two come out closest in height; one column when there is little to
      // hold. Measured rather than guessed: every card goes into the left
      // column first - the columns share the width evenly however they are
      // filled, so each card wraps there exactly as it will wherever it
      // lands - and the real heights pick the cut.
      function renderColumns(blocks, host, slotStart, extras) {
        const cards = [];
        blocks.forEach(function(block) {
          blockCards(block, slotStart).forEach(function(card) {
            cards.push(card);
          });
        });

        // The standing fixtures ride along after the slot's own blocks,
        // billed like sessions
        (extras || []).forEach(function(card) {
          cards.push(card);
        });

        const cols = el('div', 'tv-cols');
        const left = el('div', 'tv-col');
        cols.appendChild(left);
        cards.forEach(function(card) { left.appendChild(card); });
        host.appendChild(cols);

        if (cards.length < 2) return;

        const right = el('div', 'tv-col');
        cols.appendChild(right);

        // Each card is charged its height plus the column gap it brings
        const gap = parseFloat(window.getComputedStyle(left).rowGap) || 0;
        const heights = cards.map(function(card) {
          return card.offsetHeight + gap;
        });
        const total = heights.reduce(function(sum, h) { return sum + h; }, 0);

        let best = 1;
        let bestDiff = Infinity;
        let run = 0;
        for (let cut = 1; cut < cards.length; cut++) {
          run += heights[cut - 1];
          const diff = Math.abs(run - (total - run));
          if (diff < bestDiff) {
            bestDiff = diff;
            best = cut;
          }
        }

        cards.slice(best).forEach(function(card) { right.appendChild(card); });
      }

      // Where a label slot itself is held - the after-party's lobby
      const TV_SLOT_PLACES = {
        'After-party!': 'Level 2 Lobby'
      };

      // What a slot has to say for itself. The notes are written as markup
      // these days - the lunch note names its restaurants with directions
      // attached - with plain text still honoured should one revert.
      function noteFor(def, className) {
        const note = SCHEDULE_NOTES.filter(function(n) {
          return n.start === def.start;
        })[0];
        if (!note) return null;
        const made = el('p', className);
        if (note.html) made.innerHTML = note.html;
        else made.textContent = note.text || '';
        return made;
      }

      // A slot with nothing on the sheet still has a name and a story -
      // Lunch, the after-party - and the fixtures keep it company
      function renderLabelSlot(def, fixtures, host, nowMinute) {
        const row = el('div', 'tv-row');

        const card = el('article', 'tv-session');
        card.appendChild(el('h3', 'tv-session__title', def.label || ''));
        if (TV_SLOT_PLACES[def.label]) {
          card.appendChild(el('p', 'tv-session__room', TV_SLOT_PLACES[def.label]));
        }
        const note = noteFor(def, 'tv-session__note');
        if (note) card.appendChild(note);
        row.appendChild(card);

        fixtures.forEach(function(fixture) {
          row.appendChild(fixtureCard(fixture, nowMinute));
        });

        host.appendChild(row);
      }

      // The week's other shows, pitched through the after-party. The QR
      // files live in images/qr - swap the placeholders for the real codes.
      const TV_PROMOS = [
        {
          title: 'Seattle Indies Expo',
          desc: 'Play 40+ locally-made games this Sunday @ The Motif',
          qr: 'images/qr/six.png'
        },
        {
          title: 'Post-PAX Train Party',
          desc: 'Unwind after a long PAX weekend on Monday night @ Orient Express',
          qr: 'images/qr/trainparty.png'
        },
        {
          title: 'Media Indie Exchange',
          desc: 'Happening this Friday evening. Mention SLICE when registering ' +
            'for an Industry Pass.',
          qr: 'images/qr/mix.png'
        }
      ];

      function renderPromos(host) {
        const row = el('div', 'tv-promos');
        TV_PROMOS.forEach(function(promo) {
          const card = el('article', 'tv-promo');
          card.appendChild(el('h3', 'tv-session__title', promo.title));
          card.appendChild(el('p', 'tv-session__note', promo.desc));
          const qr = el('img', 'tv-promo__qr');
          qr.src = promo.qr;
          qr.alt = promo.title + ' QR code';
          card.appendChild(qr);
          row.appendChild(card);
        });
        host.appendChild(row);
      }

      // Lunch with the whole stage to itself: the name up big and the word
      // on the neighbourhood written large enough to read from a food line
      function renderLunchPrime(def, host) {
        const card = el('article', 'tv-lunch');
        card.appendChild(el('h3', 'tv-lunch__title', def.label || 'Lunch'));
        const note = noteFor(def, 'tv-lunch__note');
        if (note) card.appendChild(note);
        host.appendChild(card);
      }

      // The next slot in one breath: a line per room, a count for the runs
      function renderBrief(blocks, host) {
        const list = el('ul', 'tv-brief');

        blocks.forEach(function(block) {
          if (block.items.length > 1) {
            const title = groupTitle(block);
            if (title) {
              const li = el('li', null, block.items.length + ' ' + title.name);
              li.appendChild(el('span', 'where', title.room));
              list.appendChild(li);
              return;
            }
          }
          block.items.forEach(function(item) {
            const li = el('li', null, item.session.title);
            li.appendChild(el('span', 'where', tvRoomText(scheduleRoomPlace(item.room))));
            list.appendChild(li);
          });
        });

        host.appendChild(list);
      }

      // ---- the whole screen ----
      function build() {
        const sec = daySeconds();
        const minute = Math.floor(sec / 60);

        let running = null;
        let next = null;
        SCHEDULE_SLOTS.forEach(function(def) {
          const opens = scheduleMinutes(def.start);
          const closes = scheduleMinutes(def.end);
          if (opens <= minute && minute < closes) running = def;
          if (opens > minute && (!next || opens < scheduleMinutes(next.start))) next = def;
        });

        const runningBlocks = running ? gatherSlot(running) : [];
        const nextBlocks = next ? gatherSlot(next) : [];
        // A slot that is only its name - Lunch, the after-party - leaves
        // room, so the next slot speaks in full; so do the gaps
        const nowLite = !running || !runningBlocks.length;

        // Lunch leads with the neighbourhood: for its first hour the note
        // about the restaurants takes the whole Now area, written large,
        // before the usual layout with the fixtures comes back
        const lunchPrime = !!running && running.label === 'Lunch' &&
          minute < scheduleMinutes(running.start) + 60;

        // The last two minutes before a block of real sessions: the Now
        // section stands down, the countdown takes the top billing, and the
        // robot rolls in. It outranks even a still-running slot - the 9:00
        // Introduction counts down over the top of the 8:00 breakfast.
        const waitSec = next ? scheduleMinutes(next.start) * 60 - sec : Infinity;
        const countdown = nextBlocks.length > 0 &&
          waitSec > 0 && waitSec <= 120;

        // What the Now band says about the standing fixtures: the ones
        // running through a label slot's remaining stretch, or standing at
        // this minute - as cards in the gaps, as one quiet line under a full
        // slot. Their comings and goings join the key below, so the coffee
        // ending at 10:30 or the speed networking wrapping up at 8pm redraws
        // an otherwise still board.
        let nowFixtures;
        if (running && !runningBlocks.length) {
          nowFixtures = fixturesIn(minute, scheduleMinutes(running.end));
        } else {
          nowFixtures = fixturesAt(minute);
        }

        const key = [
          running ? running.start : '-',
          next ? next.start : '-',
          nowLite,
          countdown,
          lunchPrime,
          sessions.length,
          // The "(soon)" marker rides the key: the fixture list itself does
          // not change at seven o'clock, so without this the word would stay
          // up on an otherwise still board
          nowFixtures.map(function(f) {
            return f.title + (minute < scheduleMinutes(f.from) ? ' (soon)' : '');
          }).join('+')
        ].join('|');
        if (key === lastKey) return;
        lastKey = key;

        tickEl = null;
        countEl = null;
        countPulseEl = null;
        nowContentEl.textContent = '';
        comingContentEl.textContent = '';
        stage.classList.toggle('tv--nowlite', nowLite);
        stage.classList.toggle('tv--countdown', countdown);
        setRobot(countdown);
        // The clock rides whichever band is topmost
        if (clockEl && nowBandEl && comingBandEl) {
          (countdown ? comingBandEl : nowBandEl).appendChild(clockEl);
        }

        // -- happening now --
        if (running) {
          // The slot's own name rides the hours line where the sessions
          // take the stage - Coffee Hour, Introduction
          nowHoursEl.textContent = hoursText(running) +
            (runningBlocks.length && running.label ? ' · ' + running.label : '');
          nowHoursEl.hidden = false;
          if (runningBlocks.length) {
            // The standing fixtures are real events too: they join the
            // columns billed like sessions, after the slot's own blocks
            renderColumns(runningBlocks, nowContentEl, scheduleMinutes(running.start),
              nowFixtures.map(function(fixture) {
                return fixtureCard(fixture, minute);
              }));
          } else if (lunchPrime) {
            renderLunchPrime(running, nowContentEl);
          } else {
            renderLabelSlot(running, nowFixtures, nowContentEl, minute);
          }
        } else {
          nowHoursEl.hidden = true;
          if (nowFixtures.length) {
            const row = el('div', 'tv-row');
            nowFixtures.forEach(function(fixture) {
              row.appendChild(fixtureCard(fixture, minute));
            });
            nowContentEl.appendChild(row);
          } else {
            const card = el('article', 'tv-session');
            card.appendChild(el('h3', 'tv-session__title',
              minute < scheduleMinutes(SCHEDULE_SLOTS[0].start)
                ? 'Welcome to SLICE 2026!'
                : "That's a wrap on SLICE 2026!"));
            card.appendChild(el('p', 'tv-session__note',
              minute < scheduleMinutes(SCHEDULE_SLOTS[0].start)
                ? 'Doors open at ' + clockLower(scheduleMinutes(SCHEDULE_SLOTS[0].start)) + '.'
                : 'Thank you for coming!'));
            nowContentEl.appendChild(card);
          }
        }

        // -- coming up --
        if (next) {
          tickBase = scheduleMinutes(next.start) * 60;

          if (countdown) {
            // Simply the seconds, pulsing bigger as they run out
            comingTitleEl.textContent = 'Starting in ';
            countEl = el('span', 'tv-count');
            countPulseEl = el('span', 'tv-count__pulse', String(Math.ceil(waitSec)));
            countEl.appendChild(countPulseEl);
            comingTitleEl.appendChild(countEl);
            comingTitleEl.appendChild(document.createTextNode(' seconds!'));
            comingHoursEl.hidden = true;
          } else {
            comingTitleEl.textContent = 'Coming Up...';
            comingHoursEl.textContent = '';
            comingHoursEl.appendChild(document.createTextNode(hoursText(next) +
              (nextBlocks.length && next.label ? ' · ' + next.label : '') +
              ' · starts in '));
            tickEl = el('span', 'tick', waitText(tickBase - sec));
            comingHoursEl.appendChild(tickEl);
            comingHoursEl.hidden = false;
          }

          if (!nextBlocks.length) {
            // Previewed whole: everything the slot will hold at any point,
            // the speed networking's seven o'clock start included
            renderLabelSlot(next,
              fixturesIn(scheduleMinutes(next.start), scheduleMinutes(next.end)),
              comingContentEl);
          } else if (nowLite || countdown) {
            // The whole screen is the preview's whenever the Now section is
            // out of the way - the breaks, and the countdown takeover
            renderColumns(nextBlocks, comingContentEl, scheduleMinutes(next.start));
          } else {
            renderBrief(nextBlocks, comingContentEl);
          }
        } else if (running) {
          // The after-party: the day's last slot, with the week still to sell
          comingTitleEl.textContent = "But wait, there's more!";
          comingHoursEl.hidden = true;
          renderPromos(comingContentEl);
        } else {
          comingTitleEl.textContent = 'See You Next Year!';
          comingHoursEl.hidden = true;
          comingContentEl.appendChild(el('p', 'tv-closed',
            'McCaw Hall is now closed. Please make your way to the exit.'));
        }

        fitScreen();
      }

      // ---- keeping it inside the frame ----
      // The rem is a slice of the screen; when a full slot still runs past
      // its box, the slice narrows until it does not. The stage measurement
      // alone is not enough: a centred flex section lets tall content spill
      // out both ends without moving stage.scrollHeight, so each section is
      // also checked against its own box.
      function fitScreen() {
        const root = document.documentElement;

        function overflowing() {
          if (stage.scrollHeight > window.innerHeight + 2) return true;
          return [nowContentEl, comingContentEl].some(function(section) {
            const child = section.firstElementChild;
            return child &&
              child.getBoundingClientRect().height > section.clientHeight + 2;
          });
        }

        let fit = 1;
        root.style.setProperty('--fit', fit);
        let guard = 0;
        while (overflowing() && fit > 0.45 && guard < 12) {
          fit -= 0.05;
          guard += 1;
          root.style.setProperty('--fit', fit);
        }
      }

      // ---- the heartbeat ----
      function tick() {
        const sec = daySeconds();
        if (clockEl) {
          clockEl.textContent = clockLower(Math.floor(sec / 60));
        }
        if (tickEl) {
          tickEl.textContent = waitText(tickBase - sec);
        }
        if (countEl && countPulseEl) {
          const left = Math.max(1, Math.ceil(tickBase - sec));
          if (String(left) !== countPulseEl.textContent) {
            countPulseEl.textContent = String(left);
            // A shade larger with every second gone...
            countEl.style.transform =
              'scale(' + (1 + (120 - left) * 0.006).toFixed(3) + ')';
            // ...and one pulse per tick on top
            countPulseEl.classList.remove('is-ticking');
            void countPulseEl.offsetWidth;
            countPulseEl.classList.add('is-ticking');
          }
        }
        if (sessions.length) build();
      }

      window.setInterval(tick, 1000);
      window.addEventListener('resize', function() {
        lastKey = null;
        if (sessions.length) build();
      });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitScreen);
      }

      // ---- the sheet, now and every five minutes ----
      // A failed fetch changes nothing on screen: the board keeps what it
      // has and tries again next round. Only the first load retries fast,
      // since until it lands there is nothing to keep. An answer that says
      // what the board already shows redraws nothing at all - the screens
      // rebuild in place only when the day has actually changed, and the
      // page itself never reloads, so fullscreen and the audio hold.
      let fetching = false;
      let retryTimer = 0;

      function refresh() {
        if (offlineTest) return;
        // One fetch at a time: the five-minute interval and the first-load
        // retry must not stack chains of requests during a long outage
        if (fetching) return;
        fetching = true;
        window.clearTimeout(retryTimer);

        function tryAgainSoon() {
          fetching = false;
          if (!sessions.length) retryTimer = window.setTimeout(refresh, 30000);
        }

        const loading = loadSpeakers(SCHEDULE_DEFAULTS.speakersSheet, function(speakers) {
          if (!speakers || !speakers.length) {
            tryAgainSoon();
            return;
          }
          const inner = loadSessions(SCHEDULE_DEFAULTS.sheet, speakers, function(fresh) {
            if (!fresh.length) {
              tryAgainSoon();
              return;
            }
            fetching = false;
            const stamp = JSON.stringify(fresh.map(function(session) {
              return [session.title, session.time, session.room, session.format,
                session.speakers.map(function(speaker) { return speaker.name; })];
            }));
            if (stamp === sessionsStamp) return;
            sessionsStamp = stamp;
            sessions = fresh;
            lastKey = null;
            build();
          }, { requireSynopsis: false });

          if (inner && typeof inner.catch === 'function') {
            inner.catch(function(err) {
              console.error('Could not load the session sheet', err);
              tryAgainSoon();
            });
          }
        });

        if (loading && typeof loading.catch === 'function') {
          loading.catch(function(err) {
            console.error('Could not load the speaker sheet', err);
            tryAgainSoon();
          });
        }
      }

      refresh();
      window.setInterval(refresh, 5 * 60 * 1000);

      // ---- the offline fallback ----
      // The venue's computers may have no internet at all. The sheet gets
      // ten seconds to answer; past that, the snapshot bundled beside this
      // page takes the stage - and a live fetch that lands later, or on any
      // five-minute round after, still replaces it with the real thing.
      window.setTimeout(function() {
        if (sessions.length) return;
        const snap = window.SCHEDULE_SNAPSHOT;
        if (!snap || !snap.sessions || !snap.sessions.length) return;
        sessions = snap.sessions;
        lastKey = null;
        build();
      }, 10000);
    })();
  </script>

  <script>
    // ===================== AUDIO =====================
    // The day's soundtrack, from two folders beside this page. Every
    // announcement is named for the moment it plays - 08_57_00.wav at
    // 8:57:00 am, 24-hour clock - and fires right then. The music is a
    // playlist: 00.mp3 starts at 6:33 pm, each track follows the one
    // before it the moment it ends - never on top of it - and when the
    // last track finishes, the evening's music is done. The Volume tab of
    // the schedule spreadsheet is the day-of remote control over all of
    // it - levels, and fired-off test clips - for a computer nobody can
    // reach once the doors open. See REMOTE below.
    //
    // Each clip is fetched whole ahead of its start, so a slow venue
    // connection can never stutter mid-song: the bytes are already here
    // by the time they are due. Where fetching is impossible - the page
    // opened straight off the disk - a plain audio element told to buffer
    // early stands in, which a local disk serves without hiccups anyway.
    (function() {
      // ---- the clips, by name ----
      // Hard-coded rather than listed live: a static page cannot read a
      // folder, and these files are settled. Update by hand if they
      // change. Each playlist track carries its length in seconds - not
      // for the playing, which simply runs the file out, but so a page
      // opened mid-evening can add them up and find which track the
      // party is up to.
      const AUDIO_PLAYLIST = [
        ['00.mp3', 186.1], ['01.mp3', 161.3], ['02.mp3', 419.3],
        ['03.mp3', 216.0], ['04.mp3', 176.6], ['05.mp3', 146.4],
        ['06.mp3', 180.7], ['07.mp3', 419.7], ['08.mp3', 247.5],
        ['09.mp3', 117.0], ['10.mp3', 148.8], ['11.mp3', 229.3],
        ['12.mp3', 78.0], ['13.mp3', 365.2], ['14.mp3', 139.6],
        ['15.mp3', 182.1], ['16.mp3', 299.6], ['17.mp3', 291.2],
        ['18.mp3', 83.2], ['19.mp3', 178.7], ['20.mp3', 168.3],
        ['21.mp3', 88.6], ['22.mp3', 195.6], ['23.mp3', 252.3],
        ['24.mp3', 146.6], ['25.mp3', 151.9], ['26.mp3', 180.0],
        ['27.mp3', 228.6], ['28.mp3', 163.1], ['29.mp3', 177.4],
        ['30.mp3', 201.4], ['31.mp3', 198.6], ['32.mp3', 217.0],
        ['33.mp3', 72.4], ['34.mp3', 69.3], ['35.mp3', 209.4],
        ['36.mp3', 320.3], ['37.mp3', 172.2], ['38.mp3', 194.7],
        ['39.mp3', 174.8], ['40.mp3', 344.5], ['41.mp3', 153.1],
        ['42.mp3', 423.8], ['43.mp3', 227.8], ['44.mp3', 400.9],
        ['45.mp3', 208.0], ['46.mp3', 247.2], ['47.mp3', 241.1]
      ];
      const AUDIO_ANNOUNCEMENTS = [
        '08_00_00.wav', '08_57_00.wav', '09_27_00.wav', '10_27_00.wav',
        '11_27_00.wav', '12_18_00.wav', '13_42_00.wav', '14_42_00.wav',
        '15_42_00.wav', '16_42_00.wav', '17_42_00.wav', '21_27_15.wav',
        '21_27_45.wav'
      ];

      // The playlist's opening note
      const PLAYLIST_START = 18 * 3600 + 33 * 60;

      // The ideal first note of every track - PLAYLIST_START plus the
      // lengths of everything before it - and one mark past the end for
      // when the music is over. The real chain drifts a touch behind
      // these (each handover costs a breath), which is fine: the marks
      // only steer the big jumps - a page opened or unlocked late, a
      // stalled track - never the normal song-to-song step.
      const PLAYLIST_MARKS = [];
      {
        let mark = PLAYLIST_START;
        AUDIO_PLAYLIST.forEach(function(track) {
          PLAYLIST_MARKS.push(mark);
          mark += track[1];
        });
        PLAYLIST_MARKS.push(mark);
      }

      // How long before its mark a clip starts downloading
      const FETCH_AHEAD = 180;
      // Fired this close to its mark, a clip still plays from the top
      const JOIN_SLACK = 2;
      // A page opened mid-clip - a reload, a late setup - rejoins anything
      // that started this recently, partway through, rather than replaying
      // it from the top or skipping it
      const REJOIN_WINDOW = 10 * 60;

      function clipSeconds(name) {
        return parseInt(name.slice(0, 2), 10) * 3600 +
          parseInt(name.slice(3, 5), 10) * 60 +
          parseInt(name.slice(6, 8), 10);
      }

      // The same pretend clock the board reads: ?t=19:14 rehearses the
      // soundtrack the way it rehearses the screens
      const daySeconds = window.tvDaySeconds;

      // ---- fetching ----
      // A clip arrives whole, as a blob, and plays from memory. If the
      // fetch fails - the page came off the disk, or the server said no -
      // an audio element buffering from the src is the fallback.
      function loadClip(src) {
        return fetch(src).then(function(res) {
          if (!res.ok) throw new Error(src + ' answered ' + res.status);
          return res.blob();
        }).then(function(blob) {
          return { url: URL.createObjectURL(blob), local: true };
        }).catch(function() {
          const audio = new Audio(src);
          audio.preload = 'auto';
          audio.load();
          return { audio: audio, local: false };
        });
      }

      // One download per file, however many hands reach for it
      const clips = new Map();
      function clipReady(src) {
        let ready = clips.get(src);
        if (!ready) {
          ready = loadClip(src);
          clips.set(src, ready);
        }
        return ready;
      }

      // ---- playing ----
      const soundHint = document.getElementById('soundHint');
      // Clips the browser refused pending a touch - see the unlock below
      let refused = [];

      // ---- the remote's levers ----
      // Set from the Volume tab of the schedule spreadsheet - see the
      // REMOTE poll below. Levels are 0..1 and land on the clips already
      // playing as well as on everything played after, so a level pulled
      // down on the sheet quiets the song mid-note.
      let announcementLevel = 1;
      let musicLevel = 1;
      // Every clip on the air right now
      const onAir = new Set();
      // The one test clip allowed at a time - see killTest
      let testOnAir = null;

      // The 9:27:45 closer rides the announcement schedule but is really
      // a piece of music, so the music lever is the one that moves it
      const SOUNDS_LIKE_MUSIC = 'audio/announcements/21_27_45.wav';

      function levelFor(src) {
        if (src === SOUNDS_LIKE_MUSIC) return musicLevel;
        return src.indexOf('audio/music/') === 0 ? musicLevel : announcementLevel;
      }

      function applyLevels() {
        onAir.forEach(function(aired) {
          aired.audio.volume = levelFor(aired.src);
        });
      }

      // A test is a guest on the air: the moment any other clip starts -
      // the schedule's own, or the next test - it is taken straight off
      function killTest() {
        if (!testOnAir) return;
        const held = testOnAir;
        testOnAir = null;
        held.stop();
      }

      // Plays the clip filed under src. A clip with a mark that has gone
      // by joins in progress - or stays quiet once its own end has passed.
      // Announcements are kept for the remote's tests; a song's memory is
      // let go the moment it has played. `after`, if given, hears exactly
      // once that this play is over and done with - however it ends - and
      // is how the playlist below strings its tracks together. `still`,
      // if given, is asked at the last moment whether this play is even
      // wanted any more: a fetch that took an age, or a refused clip
      // replayed from the queue, must not land on top of whatever the
      // playlist has moved on to.
      function playClip(src, at, keep, test, after, still) {
        clipReady(src).then(function(loaded) {
          // A test never borrows the shared fallback element: were it to
          // draw the very clip the schedule has playing through it, it
          // would restart the live clip and mark it killable
          const audio = loaded.local ? new Audio(loaded.url)
            : test ? new Audio(src)
            : loaded.audio;
          const aired = { audio: audio, src: src, test: test };

          let moved = false;
          function fireAfter() {
            if (moved) return;
            moved = true;
            if (after) after();
          }

          function done() {
            audio.removeEventListener('ended', done);
            audio.removeEventListener('error', done);
            onAir.delete(aired);
            if (testOnAir && testOnAir.audio === audio) testOnAir = null;
            if (loaded.local && !keep) {
              URL.revokeObjectURL(loaded.url);
              clips.delete(src);
            }
            fireAfter();
          }

          function begin() {
            if (still && !still()) {
              done();
              return;
            }
            const behind = at == null ? 0 : Math.max(0, daySeconds() - at);
            if (behind > JOIN_SLACK) {
              if (!isFinite(audio.duration) || behind >= audio.duration - 0.25) {
                done();
                return;
              }
              audio.currentTime = behind;
            } else if (audio.currentTime) {
              // The fallback elements are reused; a second play of one
              // starts over rather than resuming at its end
              audio.currentTime = 0;
            }
            audio.volume = levelFor(src);
            // Any clip starting bumps the test on air - and a test takes
            // the vacated spot
            killTest();
            if (test) {
              testOnAir = {
                audio: audio,
                stop: function() {
                  // Marked before the pause: a play() still settling
                  // rejects when paused, and that must read as the kill
                  // doing its job, not as the browser refusing sound
                  aired.killed = true;
                  audio.pause();
                  done();
                }
              };
            }
            audio.addEventListener('ended', done);
            // A mid-play error must clear the air too, or the clip would
            // haunt the level bookkeeping all day
            audio.addEventListener('error', done);
            onAir.add(aired);
            const playing = audio.play();
            if (playing && playing.catch) {
              playing.catch(function(err) {
                if (aired.killed) return;
                audio.removeEventListener('ended', done);
                audio.removeEventListener('error', done);
                onAir.delete(aired);
                if (testOnAir && testOnAir.audio === audio) testOnAir = null;
                // Only the browser wanting a person to touch the page
                // first is worth holding the clip for: the first click or
                // key press replays it from wherever the clock has moved
                // to by then. Any other failure just stands down - though
                // whoever is waiting on this play still hears it is over.
                if (!err || err.name !== 'NotAllowedError') {
                  fireAfter();
                  return;
                }
                refused.push({ src: src, at: at, keep: keep, test: test,
                  after: after, still: still });
                if (soundHint) soundHint.hidden = false;
              });
            }
          }

          if (audio.readyState >= 1) {
            begin();
          } else {
            audio.addEventListener('loadedmetadata', begin, { once: true });
            audio.addEventListener('error', done, { once: true });
            // A fallback element fetched ahead of time may have already
            // failed, ages before these listeners could hear it. One more
            // try now that the clip is actually wanted - and failing
            // again lands on the fresh listener, so the page moves on
            // rather than waiting forever on an element gone quiet.
            if (audio.error) audio.load();
          }
        });
      }

      // The first touch retries whatever the browser refused; anything
      // whose end has passed by now drops out inside playClip
      function unlock() {
        if (!refused.length) return;
        const retry = refused;
        refused = [];
        if (soundHint) soundHint.hidden = true;
        retry.forEach(function(held) {
          playClip(held.src, held.at, held.keep, held.test, held.after,
            held.still);
        });
      }
      document.addEventListener('click', unlock);
      document.addEventListener('keydown', unlock);

      // ---- the announcement schedule ----
      // Untouched by the playlist below: every announcement still fires
      // at the exact moment its own name spells out
      const slate = [];
      AUDIO_ANNOUNCEMENTS.forEach(function(name) {
        slate.push({ src: 'audio/announcements/' + name, at: clipSeconds(name), keep: true });
      });

      // Anything already gone when the page opens stays gone - a board
      // turned on at 8 pm must not replay the day - except the most recent
      // clip, young enough to maybe still be running: that one rejoins
      const opened = daySeconds();
      let rejoin = null;
      slate.forEach(function(entry) {
        if (entry.at >= opened) return;
        entry.played = true;
        if (opened - entry.at < REJOIN_WINDOW && (!rejoin || entry.at > rejoin.at)) {
          rejoin = entry;
        }
      });
      if (rejoin) rejoin.played = false;

      // ---- the playlist ----
      // One song after another from 6:33 pm, each starting the moment the
      // one before it runs out - never on top of it - and no encore: when
      // the last track ends, the evening's music is over. A page opened
      // or reloaded mid-evening adds up the track lengths to find which
      // song the party is up to, and joins it partway through as if it
      // had been playing all along.
      let playlistOn = false;
      // Which deal of the chain is current: every playTrack bumps this,
      // and anything still holding an older number - a stale callback, a
      // fetch that finally landed, a refused play out of the queue -
      // stands down instead of playing over the newer deal
      let playlistGen = 0;
      // When the playing track has had its whole length and then some;
      // past this, the watchdog below calls the track lost and re-deals
      let playlistDue = 0;

      function playTrack(i, at) {
        if (i >= AUDIO_PLAYLIST.length) {
          playlistDue = 0;
          return;
        }
        playlistGen += 1;
        const gen = playlistGen;
        playlistDue = daySeconds() + AUDIO_PLAYLIST[i][1] + 90;
        // The next two songs download while this one plays: two, because
        // one short track may not give a slow connection long enough
        for (let ahead = i + 1;
          ahead <= i + 2 && ahead < AUDIO_PLAYLIST.length; ahead++) {
          clipReady('audio/music/' + AUDIO_PLAYLIST[ahead][0]);
        }
        playClip('audio/music/' + AUDIO_PLAYLIST[i][0], at, false, false,
          function() {
            if (gen !== playlistGen) return;
            chainFrom(i + 1);
          },
          function() {
            return gen === playlistGen;
          });
      }

      // The step between songs. Near the clock - the normal night - the
      // next track simply follows, whole, from the top. Left more than a
      // whole track behind it - a stall, a page unlocked hours late - the
      // chain leaps to the track the marks say the party is up to and
      // joins it partway, the way a fresh page would; and past the last
      // mark, nothing: the evening does not run over.
      function chainFrom(next) {
        const now = daySeconds();
        if (next >= AUDIO_PLAYLIST.length) {
          playlistDue = 0;
          return;
        }
        if (now < PLAYLIST_MARKS[next + 1]) {
          playTrack(next, null);
          return;
        }
        for (let j = next + 1; j < AUDIO_PLAYLIST.length; j++) {
          if (now < PLAYLIST_MARKS[j + 1]) {
            playTrack(j, PLAYLIST_MARKS[j]);
            return;
          }
        }
        playlistDue = 0;
      }

      function playlistTick(now) {
        if (playlistOn) {
          // The watchdog. A track gone quiet without ever ending - a
          // stream that stalled, a fetch that hung - must not park the
          // music for the night. Whatever of the chain's is still
          // notionally on the air is silenced first, so a stream that
          // recovers late cannot come back over the re-deal. A page
          // waiting on its first touch is left alone: everything is
          // queued behind the gesture there, and re-dealing would only
          // pile the queue higher.
          if (playlistDue && now > playlistDue && !refused.length) {
            playlistDue = 0;
            const stalled = [];
            onAir.forEach(function(aired) {
              if (aired.src.indexOf('audio/music/') === 0 && !aired.test) {
                stalled.push(aired);
              }
            });
            stalled.forEach(function(aired) {
              aired.killed = true;
              aired.audio.pause();
              onAir.delete(aired);
            });
            playlistGen += 1;
            chainFrom(0);
          }
          return;
        }
        if (now < PLAYLIST_START) {
          // The opener downloads ahead of the first note
          if (now >= PLAYLIST_START - FETCH_AHEAD) {
            clipReady('audio/music/' + AUDIO_PLAYLIST[0][0]);
          }
          return;
        }
        playlistOn = true;
        for (let i = 0; i < AUDIO_PLAYLIST.length; i++) {
          if (now < PLAYLIST_MARKS[i + 1]) {
            playTrack(i, PLAYLIST_MARKS[i]);
            return;
          }
        }
        // Opened after the last track's end: the music is already over
      }

      function audioTick() {
        const now = daySeconds();
        slate.forEach(function(entry) {
          if (entry.played) return;
          if (now >= entry.at) {
            entry.played = true;
            playClip(entry.src, entry.at, entry.keep);
          } else if (now >= entry.at - FETCH_AHEAD) {
            clipReady(entry.src);
          }
        });
        playlistTick(now);
      }
      window.setInterval(audioTick, 1000);
      audioTick();

      // ---- the announcement pool ----
      // Every announcement downloads from the start, one after another so
      // the fetches queue politely behind the page's own: one must be
      // ready the moment the remote calls for a test, whenever that is
      (function warm(i) {
        if (i >= AUDIO_ANNOUNCEMENTS.length) return;
        clipReady('audio/announcements/' + AUDIO_ANNOUNCEMENTS[i]).then(function() {
          warm(i + 1);
        });
      })(0);

      // ---- REMOTE ----
      // The Volume tab of the schedule spreadsheet, read through the same
      // Sheets API the session tabs use (GSheetsapi and the key sit in
      // js/shared.js). Key-value rows: AnnouncementVolume and MusicVolume
      // hold 0..100, and AnnouncementTestHash and MusicTestHash fire a
      // random test clip whenever their value changes. Polled every twenty
      // seconds; an unreachable sheet changes nothing at all, so the board
      // sails on at its last known settings.
      // Never the clip that is on the air right now: a test drawing a
      // playing clip's name would share its bytes, and stopping the one
      // could take the other down with it
      function pickTest(folder, names) {
        const clear = names.filter(function(name) {
          let taken = false;
          onAir.forEach(function(aired) {
            if (aired.src === folder + name) taken = true;
          });
          return !taken;
        });
        const pool = clear.length ? clear : names;
        return folder + pool[Math.floor(Math.random() * pool.length)];
      }

      function playTestAnnouncement() {
        playClip(pickTest('audio/announcements/', AUDIO_ANNOUNCEMENTS),
          null, true, true);
      }

      // Kept, not let go: a tested song may still have its playlist turn
      // to come, and the shared bytes must not be revoked out from under
      // that later play. A handful of tested songs held in memory is
      // nothing next to the film.
      function playTestMusic() {
        playClip(pickTest('audio/music/', AUDIO_PLAYLIST.map(function(track) {
          return track[0];
        })), null, true, true);
      }

      // The hash cells as last seen. The first successful poll only files
      // them away - a page opened mid-day must not replay the morning's
      // test - and every change after that fires one.
      const seenHashes = {};

      function heedHash(name, value, fire) {
        if (value === undefined) return;
        if (!(name in seenHashes)) {
          seenHashes[name] = value;
          return;
        }
        if (seenHashes[name] === value) return;
        seenHashes[name] = value;
        fire();
      }

      // "50" to 0.5, shrugging off anything that is not a number
      function heedLevel(value) {
        const asked = parseFloat(value);
        if (!isFinite(asked)) return null;
        return Math.min(100, Math.max(0, asked)) / 100;
      }

      // One poll at a time, the way the board's refresh guards itself: a
      // stalled answer landing after a later one would roll the levels
      // and the hash baselines backwards and fire tests that were never
      // asked for, and a black-holed connection must not stack requests
      let polling = false;

      function pollRemote() {
        if (polling) return;
        polling = true;
        GSheetsapi({
          apiKey: SPEAKERS_API_KEY,
          sheetId: SPEAKERS_SHEET_ID,
          sheetName: 'Volume'
        }).then(function(data) {
          polling = false;
          const rows = (data && data.values) || [];
          const said = {};
          rows.forEach(function(row) {
            if (row && row.length >= 2) {
              said[String(row[0]).trim()] = String(row[1]).trim();
            }
          });

          const announcement = heedLevel(said.AnnouncementVolume);
          if (announcement !== null) announcementLevel = announcement;
          const music = heedLevel(said.MusicVolume);
          if (music !== null) musicLevel = music;
          applyLevels();

          heedHash('AnnouncementTestHash', said.AnnouncementTestHash,
            playTestAnnouncement);
          heedHash('MusicTestHash', said.MusicTestHash, playTestMusic);
        }).catch(function() {
          // A failed poll changes nothing: levels hold, no test fires
          polling = false;
        });
      }

      window.setInterval(pollRemote, 20000);
      pollRemote();
    })();
  </script>

  <script>
    // ===================== EVENING =====================
    // Two after-party fixtures, both on the clock. From 6:30 to 9:30 the
    // bottom 15% of the screen is a ribbon of sponsor logos looping past a
    // thank-you, and the board squeezes up to make the room. From 6:40 to
    // 9:20, on every five-minute mark, the SIX supercut takes the whole
    // screen - it is silent, so the music underneath plays on - and hands
    // the screen back when it ends.
    (function() {
      const daySeconds = window.tvDaySeconds;

      // ---- the sponsor ribbon ----
      // The logos in the main page's order, at the widths its sponsor wall
      // settled on - equal optical area per tier. Kept in step with
      // index.html by hand, the way the fixtures are.
      const TV_SPONSORS = [
        ['unity.png', 295],
        ['wa-dept-of-commerce.png', 335],
        ['epic-games.png', 112],
        ['xsolla.png', 384],
        ['phantom-friends.png', 164],
        ['kl-gates.png', 151],
        ['aie.png', 58],
        ['nameless-deep.png', 54],
        ['11-bit-studios.png', 78],
        ['premack-rogers-downs.png', 92],
        ['miraisens.png', 129],
        ['digipen.png', 118],
        ['discord.png', 149],
        ['seattle-composers-alliance.png', 87],
        ['times-of-games.png', 110],
        ['games-industry-network.png', 93],
        ['colburn-law.png', 89],
        ['epam.png', 95],
        ['ladybug-ventures.png', 117],
        ['igda.png', 91],
        ['dames-4-games.png', 120],
        ['latinx-in-gaming.png', 85],
        ['black-voices-in-gaming.png', 89]
      ];

      const RIBBON_FROM = 18 * 3600 + 30 * 60;
      const RIBBON_UNTIL = 21 * 3600 + 30 * 60;
      // How fast the ribbon rides, in screen-heights per second
      const RIBBON_SPEED = 0.10;

      const marqueeEl = document.getElementById('tvMarquee');
      const trackEl = document.getElementById('tvMarqueeTrack');

      // Plain images, deliberately not links: nobody clicks a hallway TV
      function buildReel() {
        const reel = document.createElement('div');
        reel.className = 'tv-marquee__reel';
        const thanks = document.createElement('span');
        thanks.className = 'tv-marquee__thanks';
        thanks.textContent = 'Thank you sponsors!';
        reel.appendChild(thanks);
        TV_SPONSORS.forEach(function(sponsor) {
          const img = document.createElement('img');
          img.className = 'tv-marquee__logo';
          img.src = 'images/sponsors/' + sponsor[0];
          img.alt = '';
          img.draggable = false;
          img.style.setProperty('--w', sponsor[1]);
          reel.appendChild(img);
        });
        return reel;
      }

      trackEl.appendChild(buildReel());
      trackEl.appendChild(buildReel());

      // One reel's width sets the pace: the same slide takes longer the
      // wider the reel, so the speed reads the same on any screen and
      // however the logos land
      function paceRibbon() {
        const width = trackEl.scrollWidth / 2;
        const speed = window.innerHeight * RIBBON_SPEED;
        if (width > 0 && speed > 0) {
          trackEl.style.setProperty('--mq-secs', (width / speed).toFixed(1) + 's');
        }
      }

      // Paced once every logo has arrived - the widths settle late when
      // the page opens mid-evening - and again whenever the screen changes
      let logosComing = 0;
      Array.prototype.forEach.call(
        trackEl.querySelectorAll('img'), function(img) {
          if (img.complete) return;
          logosComing += 1;
          function landed() {
            logosComing -= 1;
            if (!logosComing) paceRibbon();
          }
          img.addEventListener('load', landed, { once: true });
          img.addEventListener('error', landed, { once: true });
        });
      window.addEventListener('resize', paceRibbon);
      paceRibbon();

      // The thank-you spans measure in the fallback face until Bungee
      // arrives, so the pace is set once more when the fonts settle -
      // the same care the board takes with its own layout
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(paceRibbon);
      }

      let ribbonUp = false;

      function ribbonTick(now) {
        const up = now >= RIBBON_FROM && now < RIBBON_UNTIL;
        if (up === ribbonUp) return;
        ribbonUp = up;
